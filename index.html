    c.fillStyle = '#c0392b'; c.fillRect(-g.headR * 1.05, g.headY - g.headR * .5, g.headR * 2.1, 3);
    c.save(); c.translate(g.w * .3, g.shY + 4); c.rotate((o.attackT || 0) > 0 ? -1.4 + (1 - o.attackT / .2) * 2.6 : -.7);
    c.fillStyle = '#6b4a2a'; c.fillRect(0, -2, 26, 4); c.fillStyle = '#8a6a3a'; c.fillRect(16, -3, 10, 6); c.restore();
  },
  rifleman(g, o) { c.fillStyle = '#3f5a2a'; c.fillRect(-g.headR * 1.1, g.headY - g.headR * 1.25, g.headR * 2.2, g.headR * .95); spRifle(g, o, 22, '#8a7a4a'); },
  sniper(g, o) {
    c.fillStyle = '#5a4a2a'; c.beginPath(); c.ellipse(0, g.headY - g.headR * .6, g.headR * 1.7, g.headR * .5, 0, 0, 6.3); c.fill(); c.fillRect(-g.headR * .8, g.headY - g.headR * 1.5, g.headR * 1.6, g.headR * .9);
    spRifle(g, o, 34, '#444'); c.fillStyle = '#7fd0ff'; c.fillRect(11, g.shY - 1, 7, 3);
  },
  medic(g, o) {
    c.fillStyle = '#e8ecf2'; c.fillRect(-g.headR * 1.05, g.headY - g.headR * 1.2, g.headR * 2.1, g.headR * .8);
    c.fillStyle = '#d9342b'; c.fillRect(-1.5, g.headY - g.headR * 1.15, 3, 6); c.fillRect(-4, g.headY - g.headR * .75 - 1, 8, 3);
    c.fillRect(-g.w * .1, g.shY + 6, 4, 12); c.fillRect(-g.w * .1 - 4, g.shY + 10, 12, 4);
    c.fillStyle = '#b8322a'; c.fillRect(g.w * .12, -g.legH - 6, 12, 9);
    if (o.work) { c.fillStyle = '#ffd54a'; const k = Math.sin((o.t || 0) * 18) > 0; c.fillRect(g.w * .4 + (k ? 3 : 0), g.shY + 2, 4, 4); c.fillStyle = '#9aa7b8'; c.fillRect(g.w * .3, g.shY + 4, 14, 3); }
  },
  grenadier(g, o) {
    c.fillStyle = '#e07a2a'; c.fillRect(-g.headR * 1.05, g.headY - g.headR * 1.2, g.headR * 2.1, g.headR * .8);
    c.fillStyle = '#5ff0c0'; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(-g.w * .22 + i * 7, -g.legH - 3, 3, 0, 6.3); c.fill(); }
    const rec = (o.recoil || 0) * 3; c.fillStyle = '#2a2a2a'; c.fillRect(4 - rec, g.shY + 1, 16, 7); c.fillStyle = '#5ff0c0'; c.fillRect(16 - rec, g.shY + 2, 4, 5);
    if ((o.attackT || 0) > .1) { c.fillStyle = '#b8ffe8'; c.beginPath(); c.arc(24 - rec, g.shY + 4, 5, 0, 6.3); c.fill(); }
  },
  heavy(g, o) {
    c.fillStyle = '#4a5568'; c.fillRect(-g.headR * 1.15, g.headY - g.headR * 1.3, g.headR * 2.3, g.headR * 1.1);
    c.fillStyle = '#8a98ad'; c.fillRect(g.w * .26, g.shY - 8, 11, g.bodyH + 18); c.fillStyle = '#c4cfdd'; c.fillRect(g.w * .26, g.shY - 8, 3, g.bodyH + 18);
    c.fillStyle = '#ffd54a'; c.fillRect(g.w * .26 + 5, g.shY + 4, 3, 8);
    if ((o.attackT || 0) > 0) { c.fillStyle = '#d0d4da'; c.fillRect(g.w * .26 + 11, g.shY + 6, 10, 4); }
  }
};
function spriteSpecial(cls, x, y, o) {
  const K = CONFIG.specials[cls], dead = !!o.dead;
  humanoid(x, y, K.w, K.h, Object.assign({ dir: o.dir || 1, t: o.t || 0, moving: !!o.moving, flash: (o.hurt || 0) > 0,
    rot: dead ? Math.min(1.45, o.dieT * 3) : 0, alpha: dead ? Math.max(0, 1 - (o.dieT - .6) / .6) : 1,
    extra: g => SP_EQUIP[cls](g, o) }, SP_PAL[cls]));
}
function drawSpecial(u) {
  const K = CONFIG.specials[u.cls];
  spriteSpecial(u.cls, u.x, u.y, u);
  if (u.dead) return;
  if (u.hp < u.maxHp) hpBar(u.x - 14, u.y - K.h - 14, 28, 3, u.hp / u.maxHp, '#4fd16f');
  const by = u.y - K.h - 8;
  c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(u.x - 15, by - 1, 30, 5);
  if (u.reload > 0) { c.fillStyle = '#ff9a2a'; c.fillRect(u.x - 14, by, 28 * (1 - u.reload / K.atk.reload), 3); }
  else if (K.ability) { c.fillStyle = u.charges > 0 ? (u.abCd > 0 ? '#3a8a74' : '#5ff0c0') : '#555'; c.fillRect(u.x - 14, by, 28 * (u.abCd > 0 ? 1 - u.abCd / K.ability.cd : 1), 3); }
  else if (K.atk.mag) { c.fillStyle = K.color; c.fillRect(u.x - 14, by, 28 * (u.ammo / K.atk.mag), 3); }
  else { c.fillStyle = K.color; c.fillRect(u.x - 14, by, 28, 3); }
  c.font = '11px ' + FONT; c.textAlign = 'center'; c.fillStyle = '#fff';
  c.fillText(u.work === 'repair' ? '🔧' : u.work === 'heal' ? '➕' : u.reload > 0 ? '⏳' : K.icon, u.x, by - 3);
}
function drawPortrait(cvs, cls) {
  const g = cvs.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, cvs.width, cvs.height);
  const bg = g.createLinearGradient(0, 0, 0, cvs.height); bg.addColorStop(0, '#1c2547'); bg.addColorStop(1, '#3a3c52'); g.fillStyle = bg; g.fillRect(0, 0, cvs.width, cvs.height);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(36, 80, 20, 5, 0, 0, 6.3); g.fill();
  const prev = c; c = g; g.save(); g.scale(1.25, 1.25);
  try { spriteSpecial(cls, 29, 62, { t: 1, dir: 1 }); } finally { g.restore(); c = prev; }
}

function drawBase() {
  const W = CONFIG.world, sc = SPRITE_CONFIG.base, x = W.baseX, y = W.baseY;
  if (!Assets.draw(c, 'base', 'idle', S.time, x, y, {})) {
    c.fillStyle = '#5b4a3a'; c.fillRect(x - 70, y - 100, 140, 100);
    c.fillStyle = '#3b2d22'; c.beginPath(); c.moveTo(x - 82, y - 100); c.lineTo(x - 55, y - 130); c.lineTo(x + 55, y - 130); c.lineTo(x + 82, y - 100); c.fill();
    c.fillStyle = '#2a1e16'; c.fillRect(x - 22, y - 62, 44, 62);
    c.fillStyle = '#cdb98a'; c.fillRect(x - 40, y - 98, 80, 22);
    c.fillStyle = '#4a3a22'; c.font = 'bold 15px ' + FONT; c.textAlign = 'center'; c.fillText(t('hud.base'), x, y - 82);
    const pulse = 8 + Math.sin(S.time * 3) * 3;
    c.save(); c.shadowColor = '#ff3b3b'; c.shadowBlur = 18; c.fillStyle = '#ff4a4a';
    c.beginPath(); c.moveTo(x, y - 62 - pulse); c.lineTo(x + 12, y - 40); c.lineTo(x, y - 22); c.lineTo(x - 12, y - 40); c.closePath(); c.fill(); c.restore();
  }
  if (S.baseHit > 0) { c.fillStyle = 'rgba(255,0,0,.25)'; c.fillRect(x - 75, y - 135, 150, 135); }
  hpBar(x - 50, y - sc.h - 12, 100, 8, S.baseHp / CONFIG.base.maxHp, '#e0a030');
}

function drawBarricade() {
  const W = CONFIG.world, lw = W.barLayerWidth, hpF = S.barHp / barMaxHp();
  const top0 = W.groundTop - 34, bottom = W.groundBottom + 8;
  const cx = W.barFront - lw * CONFIG.barricade.hpPerLevel.length / 2;
  if (S.barHp <= 0) {
    c.fillStyle = '#4a3320';
    for (let i = 0; i < 9; i++) c.fillRect(W.barFront - 20 - (i * 37 % 60), bottom - 6 - (i * 13 % 14), 12 + (i * 7 % 10), 5);
    return;
  }
  const sx = S.barHit > 0 ? rand(-1.5, 1.5) : 0;
  if (!Assets.draw(c, 'barricade', 'idle', S.time, cx + sx, bottom, { frame: S.barLevel - 1 })) {
    const colors = ['#7a5233', '#8b6038', '#a89868', '#6b7078', '#4f6a8a'];
    for (let i = 0; i < S.barLevel; i++) {
      const x = W.barFront - (i + 1) * lw + sx, top = top0 - i * 4;
      c.fillStyle = colors[i]; c.fillRect(x, top, lw, bottom - top);
      c.fillStyle = 'rgba(0,0,0,.25)';
      for (let y = top + 12; y < bottom; y += 15) c.fillRect(x, y, lw, 2);
      c.strokeStyle = '#2a1a0e'; c.lineWidth = 1; c.strokeRect(x + .5, top + .5, lw - 1, bottom - top - 1);
      if (i === 2) { c.fillStyle = '#c9b985'; for (let y = top - 6; y < top + 24; y += 10) { c.beginPath(); c.ellipse(x + lw / 2, y + 5, lw / 2 + 2, 5, 0, 0, 6.3); c.fill(); } }
      if (i === 3) { c.fillStyle = '#c4c9d0'; for (let y = top + 4; y < bottom - 10; y += 22) { c.beginPath(); c.moveTo(x + lw, y); c.lineTo(x + lw + 9, y + 6); c.lineTo(x + lw, y + 12); c.fill(); } }
      if (i === 4) { c.fillStyle = '#9fb7d6'; for (let y = top + 8; y < bottom; y += 18) c.fillRect(x + 4, y, 3, 3); }
    }
    c.fillStyle = 'rgba(0,0,0,' + ((1 - hpF) * .45).toFixed(2) + ')'; c.fillRect(W.barFront - S.barLevel * lw + sx, top0 - (S.barLevel - 1) * 4, S.barLevel * lw, bottom - top0 + (S.barLevel - 1) * 4);
    if (hpF < .5) {
      c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i < 4; i++) { const x = W.barFront - 8 - i * 15; c.moveTo(x, top0 + 20 + i * 18); c.lineTo(x + 10, top0 + 40 + i * 18); c.lineTo(x + 2, top0 + 58 + i * 18); }
      c.stroke();
    }
  }
  hpBar(W.barFront - 60, top0 - S.barLevel * 4 - 14, 70, 7, hpF, '#d94b4b');
}

function hpBar(x, y, w, h, f, col) {
  f = clamp(f, 0, 1);
  c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(x - 1, y - 1, w + 2, h + 2);
  c.fillStyle = col; c.fillRect(x, y, w * f, h);
}

function render() {
  c.imageSmoothingEnabled = !CONFIG.pixelArt;
  $('stage').classList.toggle('hit', S.baseHit > 0);
  c.save();
  if (S.shake > 0) c.translate((Math.random() - .5) * S.shake * 14, (Math.random() - .5) * S.shake * 14);
  if (!Assets.drawBg(c)) c.drawImage(bgCache, 0, 0);
  drawAmbient();
  drawBase();
  drawBarricade();
  const list = [];
  for (const v of S.vills) list.push({ y: v.y, x: v.x, w: 30, d: () => drawVillager(v) });
  for (const p of S.police) if (!p.dead || p.dieT < 1.2) list.push({ y: p.y, x: p.x, w: 30, d: () => drawPolice(p) });
  for (const u of S.specials) if (!u.dead || u.dieT < 1.2) list.push({ y: u.y, x: u.x, w: 30, d: () => drawSpecial(u) });
  for (const z of S.zombies) list.push({ y: z.y, x: z.x, w: z.w, die: z.state === 'die', d: () => drawZombie(z), z });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(it.x, it.y, it.w * .5, 5, 0, 0, 6.3); c.fill();
    it.d();
    if (it.z && !it.die && it.z.type !== 'boss') {
      const z = it.z; zTell(z); hpBar(z.x - 17, z.y - z.h - 10, 34, 4, z.hp / z.maxHp, z.type === 'infected' ? '#c46bff' : '#ff4a3d');
    }
  }
  drawEffects();
  drawLight();
  c.restore();
  drawHud();
}

function zTell(z) {
  if (CONFIG.zombies[z.type].range && z.cd < .5 && z.state === 'attack') { c.strokeStyle = '#55e08a'; c.lineWidth = 3; c.beginPath(); c.arc(z.x, z.y - z.h * .6, 8 + z.cd * 20, 0, 6.3); c.stroke(); }
}
function drawEffects() {
  for (const l of S.lures) {
    const f = l.t / l.max, ph = (S.time * 1.4) % 1;
    c.globalAlpha = .22 + .1 * Math.sin(S.time * 8); c.fillStyle = '#50ffc8'; c.beginPath(); c.ellipse(l.x, l.y, l.r, l.r * .62, 0, 0, 6.3); c.fill();
    c.globalAlpha = .85; c.strokeStyle = '#5ff0c0'; c.lineWidth = 2; c.setLineDash([8, 6]); c.beginPath(); c.ellipse(l.x, l.y, l.r, l.r * .62, 0, 0, 6.3); c.stroke(); c.setLineDash([]);
    c.globalAlpha = (1 - ph) * .7; c.beginPath(); c.ellipse(l.x, l.y, l.r * ph, l.r * ph * .62, 0, 0, 6.3); c.stroke();
    c.globalAlpha = 1; c.fillStyle = '#2a3a38'; c.fillRect(l.x - 4, l.y - 20, 8, 20); c.fillStyle = Math.sin(S.time * 14) > 0 ? '#5ff0c0' : '#c8fff0'; c.fillRect(l.x - 5, l.y - 26, 10, 7);
    c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(l.x - 21, l.y + 5, 42, 5); c.fillStyle = '#5ff0c0'; c.fillRect(l.x - 20, l.y + 6, 40 * f, 3);
  }
  for (const g of S.grenades) { c.globalAlpha = 1; c.fillStyle = '#2a3a38'; c.fillRect(Math.round(g.x) - 4, Math.round(g.y) - 4, 8, 8); c.fillStyle = '#5ff0c0'; c.fillRect(Math.round(g.x) - 2, Math.round(g.y) - 2, 4, 4); }
  for (const q of S.spits) { c.globalAlpha = 1; c.fillStyle = '#55e08a'; c.fillRect(Math.round(q.x) - 3, Math.round(q.y) - 3, 7, 7); c.fillStyle = '#c8ffd8'; c.fillRect(Math.round(q.x) - 1, Math.round(q.y) - 1, 3, 3); }
  for (const tr of S.tracers) {
    c.globalAlpha = clamp(tr.life / .09, 0, 1); c.strokeStyle = tr.color; c.lineWidth = tr.w;
    c.beginPath(); c.moveTo(tr.x1, tr.y1); c.lineTo(tr.x2, tr.y2); c.stroke();
  }
  for (const r of S.rings) {
    c.globalAlpha = clamp(r.life / r.max2, 0, 1) * .8;
    c.fillStyle = 'rgba(255,170,40,.35)'; c.strokeStyle = '#ffd36b'; c.lineWidth = 3;
    c.beginPath(); c.ellipse(r.x, r.y, r.r, r.r * .62, 0, 0, 6.3); c.fill(); c.stroke();
  }
  if (S.parts) for (const p of S.parts) { c.globalAlpha = clamp(p.life * 3, 0, 1); c.fillStyle = p.col; c.fillRect(Math.round(p.x), Math.round(p.y), 3, 3); }
  c.globalAlpha = 1; c.textAlign = 'center'; c.font = 'bold 15px ' + FONT;
  for (const f of S.floats) {
    c.globalAlpha = clamp(f.life, 0, 1); c.lineWidth = 3; c.strokeStyle = '#000'; c.strokeText(f.text, f.x, f.y);
    c.fillStyle = f.color; c.fillText(f.text, f.x, f.y);
  }
  c.globalAlpha = 1;
}

function drawHud() {
  c.textAlign = 'center';
  const boss = S.zombies.find(z => z.type === 'boss' && z.state !== 'die');
  if (boss) {
    const x = CW - 390, y = 16, w = 370;
    c.font = 'bold 15px ' + FONT; c.textAlign = 'left'; c.fillStyle = '#fff';
    c.fillText(t('boss.label') + t('z.boss') + (boss.enraged ? t('boss.rage') : ''), x, y + 2);
    c.fillStyle = 'rgba(0,0,0,.75)'; c.fillRect(x - 2, y + 6, w + 4, 18);
    c.fillStyle = boss.enraged ? '#ff2a1a' : '#d93b3b'; c.fillRect(x, y + 8, w * clamp(boss.hp / boss.maxHp, 0, 1), 14);
    c.fillStyle = '#fff'; c.fillRect(x + w * CONFIG.zombies.boss.phase2.hpPct - 1, y + 6, 2, 18);
    c.textAlign = 'center';
  }
  if (S.phase === 'rest' && !S.over) {
    c.font = 'bold 18px ' + FONT; c.lineWidth = 4; c.strokeStyle = '#000';
    const txt = t('hud.next', { n: Math.ceil(S.timer) });
    c.strokeText(txt, CW / 2, 32); c.fillStyle = '#e8ecf2'; c.fillText(txt, CW / 2, 32);
  }
  if (S.banner) {
    const b = S.banner; c.globalAlpha = clamp(Math.min(b.t, b.max - b.t) / .5, 0, 1);
    c.font = 'bold 46px ' + FONT; c.lineWidth = 7; c.strokeStyle = '#000'; c.strokeText(b.text, CW / 2, 130);
    c.fillStyle = '#ffd54a'; c.fillText(b.text, CW / 2, 130);
    c.font = 'bold 22px ' + FONT; c.lineWidth = 5; c.strokeText(b.sub, CW / 2, 164);
    c.fillStyle = '#fff'; c.fillText(b.sub, CW / 2, 164);
    c.globalAlpha = 1;
  }
}

/* ========================= 6) UI ========================= */
const UI = {
  shopRefs: [], shopOpen: false, acc: 0,

  modalOpen() { return !$('settingsModal').classList.contains('hidden') || !$('howtoModal').classList.contains('hidden') || !$('charShop').classList.contains('hidden') || !$('upShop').classList.contains('hidden'); },

  init() {
    // เมนู
    $('mPlay').onclick = () => { UI.buildStageGrid(); showScreen('stages'); };
    $('mShop').onclick = () => UI.openCharShop();
    $('mUp').onclick = () => UI.openUp();
    $('upClose').onclick = $('upClose2').onclick = () => UI.closeUp();
    $('csClose').onclick = $('csClose2').onclick = () => UI.closeCharShop();
    $('mHow').onclick = () => UI.openHowto();
    $('mSet').onclick = () => UI.openSettings();
    $('mBack').onclick = () => showScreen('menu');
    // ในเกม
    $('btnVill').onclick = buyVillager;
    $('btnPolice').onclick = buyPolice;
    $('btnBar').onclick = upgradeBarricade;
    $('btnRepair').onclick = repairBarricade;
    $('btnRepairBase').onclick = repairBase;
    $('btnShop').onclick = () => UI.openShop();
    $('btnShopClose').onclick = () => UI.closeShop();
    $('btnSkip').onclick = skipRest;
    $('btnPause').onclick = () => { if (!S.over) S.paused = !S.paused; };
    $('btnSpeed').onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; };
    $('btnHow').onclick = () => UI.openHowto();
    $('btnSet').onclick = () => UI.openSettings();
    $('btnMenu').onclick = () => { UI.closeShop(); showScreen('menu'); };
    $('btnEquipBest').onclick = () => { autoEquip(); UI.buildShop(); };
    // ตั้งค่า
    $('setSfx').oninput = e => { Settings.sfx = e.target.value / 100; $('setSfxV').textContent = e.target.value + '%'; Sound.applyVol(); Settings.save(); };
    $('setSfx').onchange = () => Sound.play('buy');
    $('setMusic').oninput = e => { Settings.music = e.target.value / 100; $('setMusicV').textContent = e.target.value + '%'; Sound.applyVol(); Settings.save(); };
    $('setMute').onchange = e => { Settings.mute = e.target.checked; Sound.applyVol(); Settings.save(); };
    $('langTh').onclick = () => UI.setLang('th');
    $('langEn').onclick = () => UI.setLang('en');
    $('setClose').onclick = () => $('settingsModal').classList.add('hidden');
    $('hwClose').onclick = () => { Settings.howtoNever = $('hwNever').checked; Settings.save(); $('howtoModal').classList.add('hidden'); };
  },
  setLang(l) {
    lang = l; Settings.lang = l; Settings.save();
    I18N.apply(); UI.syncSettings(); UI.buildStageGrid();
    UI.refreshMenuCoins(); if (UI.charShopOpen) UI.buildCharShop(); if (UI.upOpen) UI.buildUp();
    if (S && screen === 'game') { UI.buildShop(); UI.buildTeamStrip(); UI.update(); if (S.over) UI.showResult(S.cleared); }
  },
  syncSettings() {
    $('setSfx').value = Math.round(Settings.sfx * 100); $('setSfxV').textContent = Math.round(Settings.sfx * 100) + '%';
    $('setMusic').value = Math.round(Settings.music * 100); $('setMusicV').textContent = Math.round(Settings.music * 100) + '%';
    $('setMute').checked = !!Settings.mute;
    $('langTh').classList.toggle('on', lang === 'th'); $('langEn').classList.toggle('on', lang === 'en');
  },
  openSettings() { UI.syncSettings(); $('settingsModal').classList.remove('hidden'); },
  openHowto() { $('hwNever').checked = !!Settings.howtoNever; $('howtoModal').classList.remove('hidden'); },

  buildStageGrid() {
    const g = $('stageGrid'); g.innerHTML = '';
    for (let n = 1; n <= CONFIG.stages.count; n++) {
      const b = document.createElement('button'), locked = n > Save.maxStage, stars = Math.ceil(n / 4);
      if (Save.cleared[n]) b.classList.add('cleared');
      b.disabled = locked;
      b.innerHTML = '<b>' + (locked ? '🔒' : Save.cleared[n] ? n + ' ✔' : n) + '</b><small>' + '★'.repeat(stars) + '☆'.repeat(5 - stars) + '</small>';
      b.title = t('stage', { n });
      b.onclick = () => startStage(n);
      g.appendChild(b);
    }
  },

  onNewGame() {
    $('overlay').classList.add('hidden');
    UI.closeShop();
    UI.buildShop();
    UI.buildTeamStrip();
  },
  showResult(win) {
    UI.closeShop();
    if (!S.rewarded) {
      S.rewarded = true; const waves = win ? S.maxWaves : Math.max(0, S.wave - 1);
      const base = 20, wv = 15 * waves, clear = win ? 50 + 10 * S.stage : 0, perfect = win && !S.lost ? 30 : 0, rw = base + wv + clear + perfect;
      S.reward = { waves, base, wv, clear, perfect, rw }; Save.coins += rw; Save.save();
    }
    const h = $('ovTitle'), A1 = $('btnOvA'), B1 = $('btnOvB');
    h.className = win ? 'win' : '';
    if (win) {
      const last = S.stage >= CONFIG.stages.count;
      h.textContent = t('win.title', { n: S.stage });
      $('overText').textContent = t('win.text', { k: S.kills }) + (last ? '  ' + t('win.all') : '');
      if (last) { A1.classList.add('hidden'); } else { A1.classList.remove('hidden'); A1.children[0].textContent = t('win.next'); A1.onclick = () => startStage(S.stage + 1); }
      B1.children[0].textContent = t('win.replay'); B1.onclick = () => startStage(S.stage);
      let C1 = $('btnOvC'); if (!C1) { C1 = document.createElement('button'); C1.id = 'btnOvC'; C1.className = 'gray'; C1.innerHTML = '<b></b>'; $('overlay').appendChild(C1); }
      C1.children[0].textContent = t('over.stages'); C1.classList.remove('hidden'); C1.onclick = () => { UI.buildStageGrid(); showScreen('stages'); };
    } else {
      h.textContent = t('over.title');
      $('overText').textContent = t('over.text', { w: S.wave, m: S.maxWaves, k: S.kills });
      A1.classList.remove('hidden'); A1.children[0].textContent = t('over.retry'); A1.onclick = () => startStage(S.stage);
      B1.children[0].textContent = t('over.stages'); B1.onclick = () => { UI.buildStageGrid(); showScreen('stages'); };
      const C1 = $('btnOvC'); if (C1) C1.classList.add('hidden');
    }
    const R = S.reward, row = (a, b, cl) => '<div' + (cl ? ' class="' + cl + '"' : '') + '><span>' + a + '</span><span>' + b + '</span></div>';
    const fallen = S.fallen.length ? '<div class="mut">' + t('res.fallen', { n: S.fallen.map(x => t('cls.' + x)).join(', ') }) + '</div>' : '';
    $('overText').innerHTML += '<br><div class="resbox">' + row(t('res.lost'), S.lost) + row(t('res.base'), Math.ceil(S.baseHp) + '/' + CONFIG.base.maxHp) + fallen +
      '<div class="mut">' + t('res.run', { n: fmt(S.money) }) + '</div>' +
      '<div style="margin-top:6px;color:#9fb8e0"><b>' + t('res.head') + '</b></div>' +
      row(t('res.b.base'), '+' + R.base) + row(t('res.b.wave', { n: R.waves }), '+' + R.wv) +
      (R.clear ? row(t('res.b.clear'), '+' + R.clear) : '') + (R.perfect ? row(t('res.b.perfect'), '+' + R.perfect) : '') +
      row(t('res.b.total'), '+' + R.rw + ' 🪙', 'tot') + row(t('res.b.all'), fmt(Save.coins) + ' 🪙') + '</div>';
    let D1 = $('btnOvD'); if (!D1) { D1 = document.createElement('button'); D1.id = 'btnOvD'; D1.className = 'orange'; D1.innerHTML = '<b></b>'; D1.onclick = () => UI.openCharShop(); $('overlay').appendChild(D1); }
    D1.children[0].textContent = '🛒 ' + t('res.shop');
    let E1 = $('btnOvE'); if (!E1) { E1 = document.createElement('button'); E1.id = 'btnOvE'; E1.className = 'orange'; E1.innerHTML = '<b></b>'; E1.onclick = () => UI.openUp(); $('overlay').appendChild(E1); }
    E1.children[0].textContent = '⬆ ' + t('res.up');
    $('overlay').classList.remove('hidden');
  },

  /* ---- อัปเกรดถาวร ---- */
  upOpen: false,
  upNote(msg, ok) { const e = $('upMsg'); e.textContent = msg; e.style.color = ok ? '#7fe09a' : '#ff9a8a'; },
  openUp() { UI.upOpen = true; $('upMsg').textContent = ''; UI.buildUp(); $('upShop').classList.remove('hidden'); },
  closeUp() { UI.upOpen = false; $('upShop').classList.add('hidden'); UI.refreshMenuCoins(); },
  upBuy(kind, key) {
    let lvl, max, cost, name;
    if (kind === 'perm') { const P = CONFIG.perm[key]; lvl = permLvl(key); max = P.values.length; cost = P.cost[lvl]; name = t('up.n.' + key); }
    else { const g = CONFIG.guns.find(x => x.id === key); lvl = gunLvl(key); max = 3; cost = gunUpCost(g, lvl); name = t('gun.' + key); }
    if (lvl >= max) return;                                            // ขั้นสูงสุดแล้ว
    if (Save.coins < cost) return UI.upNote(t('up.why', { n: cost - Save.coins }), false);
    Save.coins -= cost; if (kind === 'perm') Save.up[key] = lvl + 1; else Save.up.gun[key] = lvl + 1;
    Save.sanitize(); Save.save(); Sound.play('buy'); UI.buildUp(); UI.refreshMenuCoins(); UI.upNote(t('up.ok', { n: name }), true);
  },
  buildUp() {
    $('upInfo').innerHTML = '<div class="chip gold">🪙 ' + t('cs.coins') + ' <b>' + fmt(Save.coins) + '</b></div>';
    const mkRow = (parent, color, name, lvl, max, desc, cost, onBuy) => {
      const row = document.createElement('div'); row.className = 'row'; row.style.borderLeftColor = color;
      const done = lvl >= max, short = !done && Save.coins < cost;
      row.innerHTML = '<div class="info"><b style="color:' + color + '">' + name + '</b> <span style="color:var(--gold);letter-spacing:2px">' + '●'.repeat(lvl) + '○'.repeat(max - lvl) + '</span><br>' + desc +
        (short ? '<br><span style="color:#ff9a8a;font-size:12px">' + t('up.why', { n: cost - Save.coins }) + '</span>' : '') + '</div>';
      const b = document.createElement('button'); b.className = done ? 'gray' : 'green'; b.innerHTML = '<b>' + (done ? t('up.max') : t('up.buy', { c: cost })) + '</b>';
      b.disabled = done || short; b.onclick = onBuy; row.appendChild(b); parent.appendChild(row);
    };
    const sections = [['upVill', ['villIncome', 'villStart', 'villMax'], '#7fe09a'], ['upPol', ['polStart', 'polMax'], '#6aa0ff'], ['upSp', ['spHp', 'spAtk', 'spSlots'], '#ffb020']];
    for (const [box, keys, color] of sections) {
      const el = $(box); el.innerHTML = '';
      for (const k of keys) {
        const P = CONFIG.perm[k], l = permLvl(k), pct = k === 'spHp' || k === 'spAtk', cur = permVal(k), nx = l < P.values.length ? P.values[l] : cur;
        const f = v => pct ? Math.round(v * 100) : v;
        mkRow(el, color, t('up.n.' + k), l, P.values.length, t('up.d.' + k, { a: f(cur), b: f(nx) }), P.cost[l], () => UI.upBuy('perm', k));
      }
    }
    const G = $('upGuns'); G.innerHTML = '';
    CONFIG.guns.forEach(g => {
      const l = gunLvl(g.id), cur = gunAt(g, l), nx = l < 3 ? gunAt(g, l + 1) : cur, f = (a, b) => a === b ? String(a) : a + ' → ' + b;
      const dm = x => (g.pellets ? +x.dmg.toFixed(1) + '×' + g.pellets : +x.dmg.toFixed(1));
      const desc = t('up.gun.stat', { d: f(dm(cur), dm(nx)), r: f(cur.rate, nx.rate), m: f(cur.mag, nx.mag), rl: f(cur.reload, nx.reload), rg: f(cur.range, nx.range) });
      mkRow(G, g.color, '[' + g.rarity + '] ' + t('gun.' + g.id), l, 3, desc, l < 3 ? gunUpCost(g, l) : 0, () => UI.upBuy('gun', g.id));
    });
  },

  /* ---- ร้านค้าตัวละครพิเศษ ---- */
  charShopOpen: false, tm: [],
  csNote(msg, ok) { const e = $('csMsg'); e.textContent = msg; e.style.color = ok ? '#7fe09a' : '#ff9a8a'; },
  openCharShop() { UI.charShopOpen = true; $('csMsg').textContent = ''; UI.buildCharShop(); $('charShop').classList.remove('hidden'); },
  closeCharShop() { UI.charShopOpen = false; $('charShop').classList.add('hidden'); UI.refreshMenuCoins(); },
  refreshMenuCoins() { $('menuCoins').textContent = fmt(Save.coins); },
  csBuy(id) {
    const K = CONFIG.specials[id];
    if (!SPECIAL_IDS.includes(id) || Save.owned[id]) return UI.csNote(t('cs.why.owned'), false);
    if (Save.coins < K.cost) return UI.csNote(t('cs.why.coin', { n: K.cost - Save.coins }), false);
    Save.coins -= K.cost; Save.owned[id] = true; Save.save(); Sound.play('buy');
    UI.buildCharShop(); UI.refreshMenuCoins(); UI.csNote(t('cs.ok.buy', { n: t('cls.' + id) }), true);
  },
  csToggle(id) {
    const slots = teamSlots(), i = Save.team.indexOf(id);
    if (!Save.owned[id]) return UI.csNote(t('cs.why.own'), false);
    if (i >= 0) { Save.team.splice(i, 1); UI.csNote(t('cs.ok.rem', { n: t('cls.' + id) }), true); }
    else {
      if (Save.team.length >= slots) return UI.csNote(t('cs.why.full', { n: Save.team.length, m: slots }), false);
      Save.team.push(id); UI.csNote(t('cs.ok.dep', { n: t('cls.' + id) }), true);
    }
    Save.sanitize(); Save.save(); Sound.play('buy'); UI.buildCharShop();
  },
  buildCharShop() {
    const C = CONFIG.specials, slots = teamSlots(), hpMul = 1 + permVal('spHp'), dmMul = 1 + permVal('spAtk');
    const teamCost = Save.team.reduce((a, id) => a + C[id].cost, 0);
    $('csInfo').innerHTML = '<div class="chip gold">🪙 ' + t('cs.coins') + ' <b>' + fmt(Save.coins) + '</b></div>' +
      '<div class="chip">' + t('cs.slots', { n: Save.team.length, m: slots }) + '</div><div class="chip">' + t('cs.teamcost', { c: teamCost }) + '</div>';
    const stat = id => { const K = C[id], A = K.atk; return { dps: Math.round(A.dmg * dmMul / A.interval), rate: (1 / A.interval).toFixed(2) + t('sp.persec') }; };
    // ช่องทีม
    const T = $('csTeam'); T.innerHTML = '';
    for (let i = 0; i < slots; i++) {
      const id = Save.team[i], d = document.createElement('div');
      if (!id) { d.className = 'slot'; d.innerHTML = '<div class="em">' + t('cs.empty') + '</div>'; }
      else {
        const K = C[id]; d.className = 'slot full';
        d.innerHTML = '<canvas class="pcv" width="72" height="90" data-cls="' + id + '"></canvas><div><b style="color:' + K.color + '">' + K.icon + ' ' + t('cls.' + id) + '</b><br>' +
          t('sp.hp') + ' ' + Math.round(K.hp * hpMul) + ' • ' + t('sp.dps') + ' ' + stat(id).dps + '<br><button class="red"><b>' + t('cs.remove') + '</b></button></div>';
        d.querySelector('button').onclick = () => UI.csToggle(id);
      }
      T.appendChild(d);
    }
    // การ์ดตัวละคร
    const G = $('csCards'); G.innerHTML = '';
    SPECIAL_IDS.forEach(id => {
      const K = C[id], A = K.atk, owned = !!Save.owned[id], inTeam = Save.team.includes(id), st = stat(id);
      const d = document.createElement('div'); d.className = 'ccard' + (owned ? ' owned' : ''); d.style.setProperty('--cc', K.color);
      let ab;
      if (K.type === 'melee' && !K.taunt) ab = t('ab.fighter', { rg: A.range });
      else if (K.type === 'ranged') ab = t('ab.rifleman', { m: A.mag, rl: A.reload });
      else if (K.type === 'sniper') ab = t('ab.sniper', { m: A.mag, rl: A.reload });
      else if (K.type === 'support') { const R = K.repair; ab = t('ab.medic', { hp: R.hp, iv: R.interval, rg: R.range, h: R.heal, c: R.costPerHp }); }
      else if (K.type === 'lure') { const B = K.ability; ab = t('ab.grenadier', { r: B.radius, d: B.dur, cd: B.cd, n: B.charges }); }
      else ab = t('ab.heavy', { p: Math.round(K.taunt.chance * 100), a: Math.round((K.armor || 0) * 100) });
      const whyBuy = owned ? '' : (Save.coins < K.cost ? t('cs.why.coin', { n: K.cost - Save.coins }) : t('cs.after', { n: Save.coins - K.cost }));
      const full = !inTeam && Save.team.length >= slots;
      const whyDep = !owned ? t('cs.why.own') : (full ? t('cs.why.full', { n: Save.team.length, m: slots }) : '');
      d.innerHTML = '<div class="hd"><canvas class="pcv" width="72" height="90" data-cls="' + id + '"></canvas><div><b style="color:' + K.color + '">' + K.icon + ' ' + t('cls.' + id) + '</b>' +
        '<small>' + t('role.' + id) + '</small><div style="color:var(--gold);font-weight:bold">🪙 ' + K.cost + '</div></div></div>' +
        '<div class="stats"><span>' + t('sp.hp') + ' <b>' + Math.round(K.hp * hpMul) + '</b></span><span>' + t('sp.dmg') + ' <b>' + +(A.dmg * dmMul).toFixed(1) + '</b></span>' +
        '<span>' + t('sp.rate') + ' <b>' + st.rate + '</b></span><span>' + t('sp.dps') + ' <b>' + st.dps + '</b></span>' +
        '<span>' + t('sp.range') + ' <b>' + (K.type === 'melee' ? t('sp.melee') + ' ' + A.range : A.range) + '</b></span><span>' + t('sp.move') + ' <b>' + K.speed + '</b></span></div>' +
        '<div>⚙ ' + ab + '</div><div class="pro">👍 ' + t('pro.' + id) + '</div><div class="con">👎 ' + t('con.' + id) + '</div><div class="use">🎯 ' + t('use.' + id) + '</div>' +
        '<div class="btns"><button class="' + (owned ? 'gray' : 'green') + '" data-a="buy"><b>' + (owned ? t('cs.owned') : t('cs.buy', { c: K.cost })) + '</b></button>' +
        '<button class="' + (inTeam ? 'red' : 'orange') + '" data-a="dep"><b>' + (inTeam ? t('cs.remove') : t('cs.deploy')) + '</b></button></div>' +
        '<div class="why' + (!owned && Save.coins >= K.cost ? ' ok' : '') + '">' + (whyBuy || '') + '</div><div class="why">' + whyDep + '</div>';
      const bb = d.querySelector('[data-a=buy]'), bd = d.querySelector('[data-a=dep]');
      bb.disabled = owned || Save.coins < K.cost; bd.disabled = !owned || full;
      bb.onclick = () => UI.csBuy(id); bd.onclick = () => UI.csToggle(id);
      G.appendChild(d);
    });
    document.querySelectorAll('#charShop canvas[data-cls]').forEach(cvs => drawPortrait(cvs, cvs.dataset.cls));
  },
  buildTeamStrip() {
    const el = $('teamStrip'); el.innerHTML = ''; UI.tm = [];
    el.classList.toggle('hidden', !S || !S.specials.length); if (!S) return;
    S.specials.forEach(u => {
      const d = document.createElement('div'); d.className = 'tm';
      d.innerHTML = '<canvas width="72" height="90"></canvas><div><b style="color:' + CONFIG.specials[u.cls].color + '">' + t('cls.' + u.cls) + '</b><div class="mini"><i></i></div><small></small></div>';
      drawPortrait(d.querySelector('canvas'), u.cls); el.appendChild(d);
      UI.tm.push({ u, d, bar: d.querySelector('i'), st: d.querySelector('small') });
    });
  },
  updateTeamStrip() {
    for (const r of UI.tm) {
      const u = r.u, K = CONFIG.specials[u.cls];
      r.bar.style.width = (u.hp / u.maxHp * 100) + '%'; r.d.classList.toggle('dead', u.dead);
      r.st.textContent = u.dead ? t('tm.dead') : u.reload > 0 ? t('tm.reload') : u.work === 'repair' ? t('tm.repair') : u.work === 'heal' ? t('tm.heal')
        : K.ability ? (u.charges <= 0 ? t('tm.lure', { n: 0 }) : u.abCd > 0 ? t('tm.lurecd', { s: Math.ceil(u.abCd) }) : t('tm.lure', { n: u.charges })) : t('tm.ready');
    }
  },

  openShop() { UI.shopOpen = true; UI.buildShop(); $('shop').classList.remove('hidden'); },
  closeShop() { UI.shopOpen = false; $('shop').classList.add('hidden'); },
  refreshShop() { if (UI.shopOpen) UI.buildShop(); },

  setBtn(id, title, sub, ok) {
    const b = $(id); b.children[0].textContent = title; b.children[1].textContent = sub; b.disabled = !ok;
  },

  buildShop() {
    if (!S) return;
    UI.shopRefs = [];
    const G = $('shopGuns'), U = $('shopUpg'), P = $('shopPolice');
    G.innerHTML = ''; U.innerHTML = ''; P.innerHTML = '';
    const mk = (parent, color, html, onBuy, refresh) => {
      const row = document.createElement('div'); row.className = 'row'; row.style.borderLeftColor = color;
      row.innerHTML = '<div class="info">' + html + '</div>';
      const btn = document.createElement('button'); btn.className = 'green'; btn.innerHTML = '<b></b>';
      btn.onclick = onBuy; row.appendChild(btn); parent.appendChild(row);
      UI.shopRefs.push(() => refresh(btn));
    };
    S.gcfg.forEach((g, i) => {
      const note = t('gun.note.' + g.id);
      mk(G, g.color,
        '<b style="color:' + g.color + '">[' + g.rarity + '] ' + t('gun.' + g.id) + (g.lvl ? ' ★' + g.lvl : '') + '</b><br>' +
        t('shop.stat', { d: g.pellets ? +g.dmg.toFixed(1) + '×' + g.pellets : +g.dmg.toFixed(1), r: +g.rate.toFixed(2), dps: Math.round(g.dmg * (g.pellets || 1) * g.rate) }) + '<br>' +
        (note !== 'gun.note.' + g.id ? '<span style="color:#9fb8e0">' + note + '</span><br>' : '') +
        t('shop.stat2', { m: g.mag, rl: g.reload, rg: g.range }) + '<br><span style="color:#8fa0b8">' + t('shop.owned', { n: S.boughtTier[i] }) + '</span>',
        () => buyGun(i),
        btn => {
          const tx = btn.children[0];
          if (!gunUnlocked(i)) { tx.textContent = t('shop.lock', { g: t('gun.' + CONFIG.guns[i - 1].id) }); btn.disabled = true; }
          else { const p = gunPrice(i); tx.textContent = t('shop.buy', { p: fmt(p) }); btn.disabled = S.money < p; }
        });
    });
    for (const k of ['pierce', 'explode']) {
      const u = CONFIG.upgrades[k], g = CONFIG.guns[u.needGun];
      const desc = k === 'pierce' ? t('upg.pierce.d', { c: u.count, f: Math.round((1 - u.falloff) * 100) }) : t('upg.explode.d', { r: u.radius, s: Math.round(u.splash * 100) });
      mk(U, g.color, '<b style="color:' + g.color + '">' + t('upg.' + k) + '</b><br>' + desc,
        () => buyUpgrade(k),
        btn => {
          const tx = btn.children[0];
          if (S.upg[k]) { tx.textContent = t('shop.done'); btn.disabled = true; }
          else if (S.boughtTier[u.needGun] <= 0) { tx.textContent = t('shop.needGun', { g: t('gun.' + g.id) }); btn.disabled = true; }
          else { tx.textContent = t('shop.buy', { p: fmt(u.price) }); btn.disabled = S.money < u.price; }
        });
    }
    // จัดปืนให้ตำรวจรายคน (ปืน 1 กระบอก ใส่ได้ 1 นาย)
    if (!S.police.length) P.innerHTML = '<div style="color:#8fa0b8;font-size:13px">' + t('shop.nopolice') + '</div>';
    S.police.forEach((p, pi) => {
      if (p.dead) return;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<div class="info"><b>' + t('shop.police', { n: pi + 1 }) + '</b></div>';
      const sel = document.createElement('select');
      let opts = '<option value="-1">' + t('shop.none') + '</option>';
      S.guns.forEach((gi, idx) => {
        if (gi.owner === -1 || gi.owner === pi) { const g = CONFIG.guns[gi.tier]; opts += '<option value="' + idx + '">' + t('gun.' + g.id) + ' #' + (idx + 1) + ' (' + g.dmg + ')</option>'; }
      });
      sel.innerHTML = opts; sel.value = String(p.gun);
      sel.onchange = () => { equip(pi, parseInt(sel.value, 10)); UI.buildShop(); };
      row.appendChild(sel); P.appendChild(row);
    });
    UI.shopRefs.forEach(f => f());
  },

  update() {
    if (!S) return;
    const E = CONFIG.economy, Pc = E.police;
    $('uMoney').textContent = fmt(S.money);
    $('uIncome').textContent = '+' + fmt(S.villagers * S.incomePer) + t('persec');
    $('uVill').textContent = S.villagers + '/' + S.villMax;
    $('uPol').textContent = livePolice().length + '/' + S.policeMax + (S.lost ? ' 💀' + S.lost : '');
    $('uSp').textContent = S.specials.filter(u => !u.dead).length + '/' + S.specials.length;
    UI.updateTeamStrip();
    const wv = clamp(S.phase === 'fight' ? S.wave : S.nextWave, 1, S.maxWaves), tier = tierOf(wv);
    const left = S.spawnQ.length + S.zombies.filter(z => z.state !== 'die').length;
    $('uWave').innerHTML = t('hud.wave', { s: S.stage, w: wv, m: S.maxWaves }) +
      ' <b style="color:' + tier.color + ';font-size:13px">(' + t('tier' + tier.i) + ')</b>';
    $('uTimer').textContent = S.phase === 'fight' ? t('hud.left', { n: left }) : t('hud.rest', { n: Math.ceil(S.timer) });
    $('uBarLv').textContent = S.barLevel;
    const bm = barMaxHp();
    $('barBar').style.width = (S.barHp / bm * 100) + '%'; $('barTxt').textContent = Math.ceil(S.barHp) + '/' + bm;
    $('baseBar').style.width = (S.baseHp / CONFIG.base.maxHp * 100) + '%'; $('baseTxt').textContent = Math.ceil(S.baseHp) + '/' + CONFIG.base.maxHp;

    const vc = villagerCost(), vmax = S.villagers >= S.villMax;
    UI.setBtn('btnVill', t('b.vill'), vmax ? t('b.vill.max', { n: S.villMax }) : t('b.vill.sub', { c: fmt(vc), i: S.incomePer }), !vmax && S.money >= vc);
    const pc = policeCost(), canConv = S.villagers - Pc.villagersRequired >= Pc.minVillagersLeft;
    const polCap = livePolice().length >= S.policeMax;
    UI.setBtn('btnPolice', t('b.police'), polCap ? t('b.police.max', { n: S.policeMax }) : t('b.police.sub', { v: Pc.villagersRequired, c: fmt(pc) }), !polCap && S.money >= pc && canConv);
    const uc = barUpgradeCost();
    UI.setBtn('btnBar', t('b.bar'), uc == null ? t('b.bar.max') : 'Lv' + S.barLevel + '→' + (S.barLevel + 1) + ' • ฿' + fmt(uc), uc != null && S.money >= uc);
    const rc = repairCost();
    UI.setBtn('btnRepair', t('b.repair'), rc > 0 ? '฿' + fmt(rc) : t('b.full'), rc > 0 && S.money >= rc);
    const bc = baseRepairCost();
    UI.setBtn('btnRepairBase', t('b.repairBase'), bc > 0 ? '฿' + fmt(bc) : t('b.full'), bc > 0 && S.money >= bc);
    UI.setBtn('btnShop', t('b.shop'), t('b.shop.sub'), true);
    UI.setBtn('btnSkip', t('b.skip'), S.phase === 'rest' ? t('b.skip.sub1') : t('b.skip.sub2'), S.phase === 'rest' && !S.over);
    UI.setBtn('btnPause', S.paused ? t('b.resume') : t('b.pause'), '', !S.over);
    UI.setBtn('btnSpeed', t('b.speed', { n: S.speed }), t('b.speed.sub'), true);
    UI.setBtn('btnHow', t('b.howto'), '', true);
    UI.setBtn('btnSet', t('b.settings'), '', true);
    UI.setBtn('btnMenu', t('b.menu'), '', true);
    if (UI.shopOpen) UI.shopRefs.forEach(f => f());
  }
};

/* ========================= เมนู: ฉากพิกเซลเคลื่อนไหว (วาดอย่างเดียว ไม่แตะตรรกะเกม) ========================= */
const Menu = (() => {
  const cvm = $('menuCv'), g = cvm.getContext('2d'), W = 320, H = 180, gy = 128;
  cvm.width = W; cvm.height = H;
  let sd = 11; const r = () => (sd = sd * 16807 % 2147483647) / 2147483647;
  const far = [], mid = [], stars = [], zs = [], em = [];
  for (let x = -4; x < W;) { const w = 14 + r() * 22; far.push({ x, w, h: 30 + r() * 40 }); x += w + 2; }
  for (let x = -4; x < W;) { const w = 20 + r() * 26, h = 40 + r() * 50, win = []; for (let wy = 8; wy < h - 6; wy += 9) for (let wx = 4; wx < w - 6; wx += 8) if (r() > .6) win.push([wx, wy, r() * 6.28]); mid.push({ x, w, h, win }); x += w + 4; }
  for (let i = 0; i < 40; i++) stars.push([r() * W | 0, r() * 70 | 0, r() * 6.28]);
  for (let i = 0; i < 8; i++) zs.push({ x0: 100 + i * 34 + r() * 18, y: 138 + r() * 28 | 0, sp: 4 + r() * 5, p: r() * 6 });
  const bands = ['#0d1226', '#121a36', '#18224a', '#232a5a', '#3a3366', '#5a3d6a', '#8a4a58'];
  const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, w, h); };
  return {
    draw(now) {
      const t = now / 1000, bh = gy / bands.length;
      bands.forEach((col, i) => R(col, 0, i * bh, W, Math.ceil(bh) + 1));
      for (const [x, y, p] of stars) R(Math.sin(t * 2 + p) > -.3 ? '#dfe6ff' : '#5a6498', x, y, 1, 1);
      R('#f2e7bd', 240, 16, 14, 14); R('#d6c88f', 245, 21, 4, 4);
      for (let i = 0; i < 5; i++) { const x = ((i * 83 - t * (3 + i)) % (W + 80) + W + 80) % (W + 80) - 40, y = 14 + i * 12 | 0; R('rgba(130,120,170,.35)', x, y, 38, 4); R('rgba(130,120,170,.35)', x + 8, y - 4, 22, 4); }
      for (const b of far) R('#141a33', b.x, gy - b.h, b.w, b.h);
      for (const b of mid) { R('#1c2342', b.x, gy - b.h, b.w, b.h); for (const [wx, wy, p] of b.win) R(Math.sin(t * 2 + p) > -.6 ? '#ffb347' : '#2a2f4c', b.x + wx, gy - b.h + wy, 3, 4); }
      R('#2c2e44', 0, gy, W, H - gy); R('#3f4260', 0, gy, W, 2);
      for (let x = 6; x < W; x += 30) R('#555a78', x, 160, 14, 1);
      for (const z of zs) {                       // ซอมบี้เดินเข้าหากำแพง
        const x = 96 + (((z.x0 - 96 - t * z.sp) % 240) + 240) % 240, y = z.y, b = Math.abs(Math.sin(t * 6 + z.p)) | 0;
        R('#000', x - 3, y, 8, 1); R('#2b3a33', x - 2, y - 10, 5, 7); R('#7fae6a', x - 2, y - 14, 5, 4); R('#ff3b30', x - 3, y - 12, 1, 1);
        R('#7fae6a', x - 7, y - 10 + b, 5, 2); R('#242b3a', x - 2, y - 3, 2, 3); R('#242b3a', x + 1, y - 3, 2, 3);
      }
      R('#5b4a3a', 8, 84, 46, 44); R('#3b2d22', 4, 78, 54, 8);          // บ้าน/ฐาน
      R(Math.sin(t * 3) > -.7 ? '#ffd27a' : '#6a4a22', 18, 98, 8, 8); R(Math.sin(t * 3 + 2) > -.7 ? '#ffd27a' : '#6a4a22', 36, 98, 8, 8);
      for (let y = 100; y < gy; y += 10) { R('#4a4358', 62, y, 22, 10); R('#2e2a3a', 62, y + 9, 22, 1); R('#5a536a', 62, y, 22, 1); }   // กำแพง
      for (let y = 96; y < gy; y += 10) R('#3a3548', 62, y, 22, 4);
      for (let x = 62; x < 84; x += 8) R('#5a536a', x, 90, 6, 8);
      const f = Math.sin(t * 11) * Math.sin(t * 7.3), fl = 4 + (f * 2 | 0);  // คบเพลิง
      R('#5a3a22', 85, 100, 2, 12); R('#ff7a1a', 83, 96 - fl, 6, 4 + fl); R('#ffd54a', 85, 97 - fl, 2, 3 + fl);
      g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(86, 100, 1, 86, 100, 46 + f * 6);
      gr.addColorStop(0, 'rgba(255,150,40,.4)'); gr.addColorStop(1, 'rgba(255,100,20,0)'); g.fillStyle = gr; g.fillRect(30, 55, 110, 90); g.restore();
      if (Math.random() < .35) em.push({ x: 86 + Math.random() * 3, y: 96, vx: (Math.random() - .3) * 10, vy: -12 - Math.random() * 14, life: 1.2 });
      for (const e of em) { e.life -= .016; e.x += e.vx * .016; e.y += e.vy * .016; R('#ffb347', e.x, e.y, 1, 1); }
      for (let i = em.length - 1; i >= 0; i--) if (em[i].life <= 0) em.splice(i, 1);
    }
  };
})();

/* ========================= 7) MAIN LOOP / การนำทางหน้าจอ ========================= */
function showScreen(name) {
  screen = name;
  if (name === 'menu') UI.refreshMenuCoins();
  $('menuMain').classList.toggle('hidden', name !== 'menu');
  $('menuStages').classList.toggle('hidden', name !== 'stages');
  $('menuWrap').classList.toggle('hidden', name === 'game');
  $('gameWrap').classList.toggle('hidden', name !== 'game');
}
function startStage(n) {
  newGame(n);
  showScreen('game');
  UI.update();
  if (n === 1 && !Settings.howtoNever) UI.openHowto();     // ด่านแรกแสดงวิธีเล่นอัตโนมัติ
}

let lastT = 0;
function frame(now) {
  let dt = Math.min((now - lastT) / 1000, .1); lastT = now;
  if (screen === 'game' && S) {
    if (!S.paused && !S.over && !UI.modalOpen()) {
      let rem = dt * S.speed;
      while (rem > 0) { const d = Math.min(rem, .05); update(d); rem -= d; }
    }
    render();
    UI.acc += dt;
    if (UI.acc >= .1) { UI.acc = 0; UI.update(); }
  } else Menu.draw(now);
  requestAnimationFrame(frame);
}

function init() {
  Settings.load(); Save.load();
  I18N.apply();
  Assets.load();
  bgCache = makeBg();
  UI.init();
  UI.syncSettings();
  // เสียงต้องเริ่มหลังผู้ใช้กดอะไรสักอย่าง (ข้อจำกัดของเบราว์เซอร์)
  document.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); });
  document.addEventListener('click', e => { if (e.target && e.target.closest && e.target.closest('button')) Sound.play('click'); });
  // เอฟเฟกต์ซื้อสำเร็จ: ปุ่มเรืองสีเขียว + ตัวเลขเงินที่ใช้ลอยขึ้นเหนือฐาน
  document.addEventListener('click', e => {
    const b = e.target && e.target.closest && e.target.closest('#controls button, #shop .row button');
    if (!b || !S) return; const m = S.money;
    setTimeout(() => { if (S && S.money < m - 5) { b.classList.add('bought'); addFloat(CONFIG.world.baseX + 40, CONFIG.world.baseY - 150, '-฿' + fmt(m - S.money), '#ff9a6a'); setTimeout(() => b.classList.remove('bought'), 450); } }, 0);
  }, true);
  UI.refreshMenuCoins();
  showScreen('menu');
  requestAnimationFrame(tm => { lastT = tm; frame(tm); });
}
init();

   วิธีใส่ภาพ Unit และปรับบาลานซ์
   ---------------------------------------------------------------------
   [ใส่ภาพ]  แก้ SPRITES (หัวข้อ 2) ใส่พาธ png แทน null เช่น police: 'assets/police.png'
     • ภาพนิ่ง: เว้น frameWidth/frameHeight เป็น null
     • sprite sheet: ตั้ง frameWidth/frameHeight ใน SPRITE_CONFIG แล้วกำหนด anims (idle/walk/attack/die)
     • ขนาด w,h / จุดยึด anchor / ทิศภาพต้นฉบับ facing ปรับได้ใน SPRITE_CONFIG
     • บาริเคทแบบ sprite sheet: เฟรมที่ n = เลเวล n+1
     • เปลี่ยนรูประหว่างเล่นในคอนโซล: Assets.set('police','assets/police.png')
   [บาลานซ์]  แก้ CONFIG (หัวข้อ 1)
     • รายได้/ชาวบ้านสูงสุด/ราคา → CONFIG.economy      • ปืน (ดาเมจ ระยะ แม็ก เวลาเปลี่ยนแม็ก ราคา) → CONFIG.guns
     • อัปเกรดทะลุ/ระเบิด → CONFIG.upgrades             • ซอมบี้ → CONFIG.zombies
     • เวฟในด่าน → CONFIG.wave                          • ความยาก 20 ด่าน → CONFIG.stages
   [ภาษา]  เพิ่ม/แก้ข้อความที่ LANG (หัวข้อ 1b)
