<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUTBREAK – Zombie Survival Base Defense</title>
<meta name="application-name" content="OUTBREAK"><meta name="apple-mobile-web-app-title" content="OUTBREAK"><meta name="description" content="OUTBREAK – pixel-art zombie survival and base defense">
<style>
*{box-sizing:border-box}
:root{--bg:#090d18;--pan:#111a2f;--pan2:#0b1223;--bd:#2c4272;--gold:#ffc83d;--mut:#8fa3c4}
body{margin:0;background:var(--bg);color:#e8ecf2;font-family:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif}
#app{max-width:1120px;margin:0 auto;padding:8px}
.hp,.grp,.panel{background:var(--pan);border:2px solid var(--bd);border-radius:6px;box-shadow:inset 0 0 0 2px #0a1020,0 3px 0 #04060d}
.hp h4,.grp h4{margin:0 0 5px;font-size:12px;letter-spacing:.5px;color:#7fa0e0}
#topbar{display:grid;grid-template-columns:5fr 7fr;gap:8px;margin-bottom:8px}
.hp{padding:6px 8px}
.hrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--pan2);border:2px solid #22345c;border-radius:4px;padding:4px 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.chip b{color:var(--gold);font-size:17px}
.chip.gold{border-color:#7a5a12}
.chip small{color:#7fe09a;font-size:13px}
#uTimer{color:#ffb347}
.bar{position:relative;width:140px;height:18px;background:#05070d;border:2px solid #000;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#d94b4b;transition:width .1s}
.bar.base{width:170px}.bar.base i{background:#e0a030}
.bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(0,0,0,.28) 7px 8px);pointer-events:none}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;text-shadow:0 0 3px #000,1px 1px 0 #000;z-index:1}
#stage{position:relative;border-radius:6px}
#stage.hit{box-shadow:0 0 0 3px #ff3b30,0 0 24px rgba(255,59,48,.6)}
canvas{display:block;width:100%;height:auto;background:#000;border-radius:5px;image-rendering:pixelated}
#game{border:3px solid var(--bd)}
#controls{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:8px}
.grp{padding:6px 8px 8px}.g-eco{grid-column:span 4}.g-build{grid-column:span 8}.g-sys{grid-column:span 12}
.gb{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px}
button{font-family:inherit;color:#fff;background:#3a5fb0;border:2px solid #0a1022;border-radius:4px;padding:8px 6px;min-height:46px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-shadow:0 1px 0 rgba(0,0,0,.6);transition:transform .06s,filter .1s;box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.32),0 3px 0 #05070d}
button b{font-size:14px}
button small{font-size:12px;color:#ffe08a}
button:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
button:disabled{background:#2a3042;color:#7c8494;cursor:not-allowed;box-shadow:inset 0 2px 0 rgba(255,255,255,.06),inset 0 -4px 0 rgba(0,0,0,.3),0 3px 0 #05070d}
button:disabled small{color:#ff8a7a}
button.gray{background:#3a4968}
button.green{background:#2f9a54}button.orange{background:#d0762f}button.red{background:#c2403a}
button.on{outline:3px solid var(--gold)}
button.bought{animation:buy .45s}
@keyframes buy{0%{box-shadow:0 0 0 0 rgba(120,255,160,.95)}100%{box-shadow:0 0 0 14px rgba(120,255,160,0)}}
#btnVill b::before{content:'👨‍🌾 '}#btnPolice b::before{content:'👮 '}#btnBar b::before{content:'🧱 '}#btnRepair b::before{content:'🔧 '}#btnRepairBase b::before{content:'🏠 '}
#mPlay b::before{content:'▶ '}#mShop b::before{content:'🛒 '}#mUp b::before{content:'⬆ '}#mHow b::before{content:'❓ '}#mSet b::before{content:'⚙ '}
.hidden{display:none!important}
.modal{position:absolute;inset:0;background:rgba(5,7,14,.86);overflow:auto;border-radius:6px;z-index:5}
.fixedModal{position:fixed;inset:0;background:rgba(5,7,14,.9);overflow:auto;z-index:30}
.panel{max-width:760px;margin:14px auto;padding:14px}
.panel h2{margin:0 0 8px;font-size:20px;color:var(--gold)}
.panel h3{margin:14px 0 6px;font-size:15px;color:#9fb8e0;border-bottom:2px solid #22345c;padding-bottom:3px}
.row{display:flex;align-items:center;gap:10px;background:var(--pan2);border:2px solid #22345c;border-radius:4px;padding:8px;margin-bottom:6px;border-left:6px solid #888}
.row .info{flex:1;font-size:13px;line-height:1.5}.row .info b{font-size:15px}
.row button{min-width:150px}
.row select{background:#080d1a;color:#fff;border:2px solid #2c4272;border-radius:4px;padding:5px;font-family:inherit;max-width:230px}
.close{position:sticky;float:right;top:0;min-width:40px;padding:4px 10px;flex-direction:row}
#overlay{position:absolute;inset:0;background:rgba(3,4,10,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;border-radius:6px;text-align:center}
#overlay h2{font-size:42px;margin:0;color:#ff5a4d;text-shadow:3px 3px 0 #2a0a08}
#overlay h2.win{color:#6fe08a;text-shadow:3px 3px 0 #0b3018}
#overlay button{min-width:220px;font-size:18px}
#menuWrap{position:relative;min-height:94vh;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid var(--bd);border-radius:6px}
#menuCv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;border-radius:0}
.menuPage{position:relative;z-index:1;width:100%;max-width:760px;text-align:center;padding:20px}
.menuPage h1{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(46px,12vw,110px);margin:0;color:#ffb020;letter-spacing:6px;text-shadow:4px 4px 0 #9a2d12,8px 8px 0 #160806,0 0 40px rgba(255,120,30,.45)}
.menuPage .sub{color:#e3ecff;margin:8px 0 26px;font-size:18px;text-shadow:0 2px 0 #000,0 0 10px #000}
.menuBtns{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:0 auto}
.menuBtns button{font-size:20px;padding:12px;flex-direction:row;justify-content:center;min-height:54px}
.menuBtns button b{font-size:20px}
#mPlay{font-size:26px;min-height:68px;animation:pulse 1.6s infinite steps(2)}
#mPlay b{font-size:26px}
@keyframes pulse{50%{filter:brightness(1.18)}}
#menuStages{background:rgba(9,13,24,.9);border:2px solid var(--bd);border-radius:6px;margin:16px}
#stageGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
#stageGrid button{padding:12px 4px;font-size:22px}
#stageGrid button small{color:#ffe08a;letter-spacing:1px}
#stageGrid button.cleared{background:#2f9a54}
.howto ol{padding-left:22px;line-height:1.7;font-size:15px;margin:6px 0}
.setrow{display:flex;align-items:center;gap:12px;margin:12px 0}.setrow label{min-width:130px}.setrow input[type=range]{flex:1}
.langbtns{display:flex;gap:8px}.langbtns button{flex-direction:row;padding:6px 16px}
@media(max-width:760px){#topbar{grid-template-columns:1fr}.g-eco,.g-build{grid-column:span 12}#stageGrid{grid-template-columns:repeat(4,1fr)}.bar,.bar.base{width:120px}}
.menuPage h1{position:relative;-webkit-text-stroke:2px #1a0806;paint-order:stroke fill}
.menuPage h1::after{content:attr(data-t);position:absolute;inset:0;color:transparent;background:repeating-linear-gradient(115deg,transparent 0 17px,rgba(10,4,6,.75) 17px 19px,transparent 19px 41px),repeating-linear-gradient(80deg,transparent 0 9px,rgba(10,4,6,.5) 9px 10px,transparent 10px 23px);-webkit-background-clip:text;background-clip:text;pointer-events:none;-webkit-text-stroke:0}
#gameLogo{font-family:Impact,'Arial Black',sans-serif;font-size:18px;letter-spacing:3px;color:#ffb020;text-shadow:2px 2px 0 #9a2d12,3px 3px 0 #160806;margin:0 0 4px 2px}
.cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.ccard{background:var(--pan2);border:2px solid #22345c;border-left:6px solid var(--cc,#888);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45}
.ccard.owned{border-color:#2f9a54;border-left-color:var(--cc,#888)}
.ccard .hd{display:flex;gap:10px;align-items:center}
.ccard .hd b{font-size:16px}.ccard .hd small{color:var(--mut);display:block}
.pcv{width:72px;height:90px;flex:none;background:#0b1223;border:2px solid #22345c;border-radius:4px;image-rendering:pixelated}
.ccard .stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;color:#cfe0ff;font-size:12.5px}
.ccard .stats span b{color:var(--gold)}
.ccard .pro{color:#7fe09a}.ccard .con{color:#ff9a8a}.ccard .use{color:#9fb8e0}
.ccard .btns{display:flex;gap:6px;margin-top:2px}.ccard .btns button{flex:1;min-width:0}
.ccard .why{color:#ff9a8a;font-size:12px;min-height:16px}.ccard .why.ok{color:#8fa3c4}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.slot{display:flex;gap:8px;align-items:center;background:var(--pan2);border:2px dashed #22345c;border-radius:6px;padding:6px 8px;min-height:104px;font-size:12.5px}
.slot.full{border-style:solid;border-color:#2f9a54}.slot .em{color:var(--mut);width:100%;text-align:center}
.slot button{min-height:32px;padding:3px 8px;margin-top:4px;font-size:12px}
#csMsg{min-height:20px;margin:8px 0 0;font-size:14px;font-weight:bold}
#teamStrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding:6px 8px}
.tm{display:flex;gap:8px;align-items:center;background:var(--pan2);border:2px solid #22345c;border-radius:4px;padding:4px 8px;font-size:12px}
.tm canvas{width:30px;height:38px;border:1px solid #22345c;background:#0b1223;image-rendering:pixelated}
.tm .mini{width:92px;height:7px;background:#05070d;border:1px solid #000;margin:2px 0}.tm .mini i{display:block;height:100%;background:#4fd16f}
.tm.dead{opacity:.5;filter:grayscale(1)}
#overlay{overflow:auto;justify-content:safe center}
#overText{line-height:1.5}
.resbox{display:inline-block;text-align:left;font-size:14px;margin-top:6px;background:rgba(9,13,24,.7);border:2px solid #22345c;border-radius:6px;padding:6px 12px;min-width:290px}
.resbox div{display:flex;justify-content:space-between;gap:16px}.resbox .tot{border-top:1px solid #22345c;margin-top:3px;padding-top:3px;color:var(--gold);font-weight:bold}
.resbox .mut{color:var(--mut)}
</style>
</head>
<body>
<div id="app">

  <!-- ===== หน้าเมนู ===== -->
  <div id="menuWrap">
    <canvas id="menuCv"></canvas>
    <div id="menuMain" class="menuPage">
      <h1 data-i18n="menu.title" data-t="OUTBREAK"></h1>
      <div class="menuBtns">
        <button id="mPlay" class="green"><b data-i18n="menu.play"></b></button>
        <button id="mShop" class="orange"><b data-i18n="menu.shop"></b></button>
        <button id="mUp" class="orange"><b data-i18n="menu.up"></b></button>
        <button id="mHow" class="gray"><b data-i18n="menu.howto"></b></button>
        <button id="mSet" class="gray"><b data-i18n="menu.settings"></b></button>
      </div>
      <div class="chip gold" style="display:inline-flex;margin-top:18px;background:rgba(9,13,24,.88)">🪙 <span data-i18n="cs.coins"></span> <b id="menuCoins">0</b></div>
    </div>
    <div id="menuStages" class="menuPage hidden">
      <h2 data-i18n="stages.title" style="font-size:30px;margin:0"></h2>
      <div id="stageGrid"></div>
      <button id="mBack" class="gray" style="margin:0 auto;flex-direction:row;padding:10px 26px"><b data-i18n="back"></b></button>
    </div>
  </div>

  <!-- ===== หน้าเกม ===== -->
  <div id="gameWrap" class="hidden">
    <div id="gameLogo">OUTBREAK</div>
    <div id="topbar">
      <div class="hp"><h4 data-i18n="grp.res"></h4><div class="hrow">
        <div class="chip gold">💰 <span data-i18n="hud.money"></span> <b id="uMoney">0</b><small id="uIncome"></small></div>
        <div class="chip">👨‍🌾 <span data-i18n="hud.vill"></span> <b id="uVill">0</b></div>
        <div class="chip">👮 <span data-i18n="hud.police"></span> <b id="uPol">0</b></div>
        <div class="chip">🎖 <span data-i18n="hud.special"></span> <b id="uSp">0</b></div>
      </div></div>
      <div class="hp"><h4 data-i18n="grp.battle"></h4><div class="hrow">
        <div class="chip">🌊 <span id="uWave"></span> <small id="uTimer"></small></div>
        <div class="chip">🧱 <span data-i18n="hud.bar"></span> Lv<span id="uBarLv"></span>
          <div class="bar"><i id="barBar"></i><span id="barTxt"></span></div></div>
        <div class="chip">🏠 <span data-i18n="hud.base"></span>
          <div class="bar base"><i id="baseBar"></i><span id="baseTxt"></span></div></div>
      </div></div>
    </div>

    <div id="stage">
      <canvas id="game"></canvas>

      <div id="shop" class="modal hidden">
        <div class="panel">
          <button class="close red" id="btnShopClose"><b>✕</b></button>
          <h2 data-i18n="shop.title"></h2>
          <h3 data-i18n="shop.guns"></h3>
          <div id="shopGuns"></div>
          <h3 data-i18n="shop.upg"></h3>
          <div id="shopUpg"></div>
          <h3 data-i18n="shop.equip"></h3>
          <div style="margin-bottom:6px"><button class="gray" id="btnEquipBest" style="flex-direction:row"><b data-i18n="shop.auto"></b></button></div>
          <div id="shopPolice"></div>
        </div>
      </div>

      <div id="overlay" class="hidden">
        <h2 id="ovTitle"></h2>
        <div id="overText" style="font-size:18px"></div>
        <button id="btnOvA" class="green"><b></b></button>
        <button id="btnOvB" class="gray"><b></b></button>
      </div>
    </div>

    <div id="teamStrip" class="grp hidden"></div>
    <div id="controls">
      <section class="grp g-eco"><h4 data-i18n="grp.eco"></h4><div class="gb"><button id="btnVill" class="green"><b></b><small></small></button><button id="btnPolice"><b></b><small></small></button></div></section>
      <section class="grp g-build"><h4 data-i18n="grp.build"></h4><div class="gb"><button id="btnBar" class="orange"><b></b><small></small></button><button id="btnRepair" class="orange"><b></b><small></small></button><button id="btnRepairBase" class="orange"><b></b><small></small></button><button id="btnShop" class="gray"><b></b><small></small></button></div></section>
      <section class="grp g-sys"><h4 data-i18n="grp.sys"></h4><div class="gb"><button id="btnSkip" class="gray"><b></b><small></small></button><button id="btnPause" class="gray"><b></b><small></small></button><button id="btnSpeed" class="gray"><b></b><small></small></button><button id="btnHow" class="gray"><b></b><small></small></button><button id="btnSet" class="gray"><b></b><small></small></button><button id="btnMenu" class="red"><b></b><small></small></button></div></section>
    </div>
  </div>
</div>

<!-- ===== หน้าต่างตั้งค่า / วิธีเล่น (ใช้ได้ทั้งในเมนูและระหว่างเล่น) ===== -->
<div id="settingsModal" class="fixedModal hidden">
  <div class="panel">
    <h2 data-i18n="set.title"></h2>
    <div class="setrow"><label data-i18n="set.sfx"></label><input type="range" id="setSfx" min="0" max="100"><span id="setSfxV" style="min-width:40px"></span></div>
    <div class="setrow"><label data-i18n="set.music"></label><input type="range" id="setMusic" min="0" max="100"><span id="setMusicV" style="min-width:40px"></span></div>
    <div class="setrow"><label data-i18n="set.mute"></label><input type="checkbox" id="setMute"></div>
    <div class="setrow"><label data-i18n="set.lang"></label>
      <div class="langbtns"><button id="langTh" class="gray"><b>ไทย</b></button><button id="langEn" class="gray"><b>English</b></button></div></div>
    <button id="setClose" class="green" style="margin:14px auto 0;padding:10px 30px;flex-direction:row"><b data-i18n="close"></b></button>
  </div>
</div>
<div id="howtoModal" class="fixedModal hidden">
  <div class="panel howto">
    <h2 data-i18n="how.title"></h2>
    <div data-i18n-html="how.body"></div>
    <label style="display:block;margin:10px 0;font-size:14px;color:#9fb0c8"><input type="checkbox" id="hwNever"> <span data-i18n="how.never"></span></label>
    <button id="hwClose" class="green" style="margin:6px auto 0;padding:10px 30px;flex-direction:row"><b data-i18n="how.ok"></b></button>
  </div>
</div>

<!-- ===== ร้านค้าตัวละครพิเศษ (เปิดจากหน้าเมนู) ===== -->
<div id="charShop" class="fixedModal hidden">
  <div class="panel" style="max-width:1000px">
    <button class="close red" id="csClose"><b>✕</b></button>
    <h2 data-i18n="cs.title"></h2>
    <div id="csInfo" class="hrow"></div>
    <div id="csMsg"></div>
    <h3 data-i18n="cs.team"></h3>
    <div id="csTeam" class="slots"></div>
    <div style="color:var(--mut);font-size:12.5px;margin-top:6px" data-i18n="cs.note"></div>
    <h3 data-i18n="cs.recruit"></h3>
    <div id="csCards" class="cardGrid"></div>
    <button id="csClose2" class="green" style="margin:14px auto 0;padding:10px 30px;flex-direction:row"><b data-i18n="close"></b></button>
  </div>
</div>

<!-- ===== อัปเกรดถาวร (เปิดจากหน้าเมนู) ===== -->
<div id="upShop" class="fixedModal hidden">
  <div class="panel" style="max-width:900px">
    <button class="close red" id="upClose"><b>✕</b></button>
    <h2 data-i18n="up.title"></h2>
    <div id="upInfo" class="hrow"></div>
    <div style="color:var(--mut);font-size:12.5px;margin:6px 0" data-i18n="up.note"></div>
    <div id="upMsg" style="min-height:20px;font-weight:bold;margin:4px 0"></div>
    <h3 data-i18n="up.sec.vill"></h3><div id="upVill"></div>
    <h3 data-i18n="up.sec.pol"></h3><div id="upPol"></div>
    <h3 data-i18n="up.sec.sp"></h3><div id="upSp"></div>
    <h3 data-i18n="up.sec.gun"></h3><div id="upGuns"></div>
    <button id="upClose2" class="green" style="margin:14px auto 0;padding:10px 30px;flex-direction:row"><b data-i18n="close"></b></button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   OUTBREAK – Zombie Survival Base Defense  (HTML5 Canvas ล้วน ไฟล์เดียว)
   ส่วนของโค้ด: 0 ยูทิลิตี้ | 1 CONFIG | 1b ภาษา | 1c ตั้งค่า/เซฟ/เสียง | 2 ASSETS | 3 STATE | 4 UPDATE | 5 RENDER | 6 UI | 7 MAIN
   ===================================================================== */

/* ========================= 0) ยูทิลิตี้ ========================= */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FONT = "'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif";
const fmt = n => {
  n = Math.floor(n);
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
};

/* ========================= 1) CONFIG =========================
   ตัวเลขบาลานซ์ทั้งหมดอยู่ที่นี่ที่เดียว (ราคา ดาเมจ เลือด ความเร็ว เวลา) */
const CONFIG = {
  pixelArt: true,                         // true = ภาพ sprite ไม่เบลอ
  canvas: { width: 1100, height: 540 },

  world: {
    groundTop: 396, groundBottom: 486,
    baseX: 85, baseY: 480, baseFront: 165,
    barFront: 372, barLayerWidth: 14,
    spawnX: 1150, policeRight: 292
  },

  economy: {
    startMoney: 150,
    startVillagers: 3,
    incomePerVillager: 5,                 // เงิน/วินาที ต่อชาวบ้าน 1 คน
    villagerMax: 10,                      // ชาวบ้านสูงสุด
    villager: { baseCost: 100, growth: 1.15 },
    police: { baseCost: 150, growth: 1.25, villagersRequired: 1, minVillagersLeft: 1, hp: 100 },
    gunPriceGrowth: 1.15                  // ซื้อปืนระดับเดิมซ้ำ ราคา = price * growth^(จำนวนที่เคยซื้อ)
  },

  barricade: {
    hpPerLevel: [500, 700, 1000, 1400, 2000],
    upgradeCost: [300, 700, 1500, 3500],
    repairCostPerHp: 0.5

const SPECIAL_IDS = ['fighter', 'rifleman', 'sniper', 'medic', 'grenadier', 'heavy'];
const PERM_KEYS = ['villIncome', 'villStart', 'villMax', 'polStart', 'polMax', 'spHp', 'spAtk', 'spSlots'];
const permLvl = k => (Save.up && Save.up[k]) || 0;
const permVal = k => { const P = CONFIG.perm[k], l = permLvl(k); return l > 0 ? P.values[l - 1] : P.base; };
const gunLvl = id => (Save.up && Save.up.gun && Save.up.gun[id]) || 0;
const teamSlots = () => permVal('spSlots');
const waveCount = st => CONFIG.wave.stageWaves.find(([to]) => st <= to)[1];
const gunUpCost = (g, l) => { const B = CONFIG.perm.gun.base; return Math.round(clamp(g.price * B.pct, B.min, B.max) * CONFIG.perm.gun.costMul[l] / 10) * 10; };
function gunAt(g, l) {                          // สเตตัสปืนที่อัปเกรดถาวรถึงขั้น l
  const U = CONFIG.perm.gun.step;
  return Object.assign({}, g, { dmg: +(g.dmg * (1 + U.dmg * l)).toFixed(2), rate: +(g.rate * (1 + U.rate * l)).toFixed(2), range: Math.round(g.range * (1 + U.range * l)),
    reload: +(g.reload * (1 - U.reload * l)).toFixed(2), mag: Math.round(g.mag * (1 + U.mag * l)), lvl: l });
}
const buildGunCfg = () => CONFIG.guns.map(g => gunAt(g, gunLvl(g.id)));
const stageParams = n => {
  const S0 = CONFIG.stages, k = n - 1;
  return { hp: 1 + S0.hpPerStage * k, dmg: 1 + S0.dmgPerStage * k, count: 1 + S0.countPerStage * k,
           speed: 1 + S0.speedPerStage * k, reward: 1 + S0.rewardPerStage * k, infected: S0.infectedPerStage * k };
};

// เสียงสังเคราะห์ด้วย WebAudio (ไม่ต้องมีไฟล์เสียง)
const Sound = {
  ctx: null, sfx: null, mus: null, last: {}, step: 0, nbuf: null,
  init() {
    if (this.ctx || typeof AudioContext === 'undefined') return;
    try {
      this.ctx = new AudioContext();
      this.sfx = this.ctx.createGain(); this.mus = this.ctx.createGain();
      this.sfx.connect(this.ctx.destination); this.mus.connect(this.ctx.destination);
      this.applyVol();
      setInterval(() => this.musicTick(), 520);
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  applyVol() {
    if (!this.ctx) return;
    const m = Settings.mute ? 0 : 1;
    this.sfx.gain.value = Settings.sfx * m; this.mus.gain.value = Settings.music * m * 0.5;
  },
  tone(f, d, type, v, slide, delay, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + (delay || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
    g.gain.setValueAtTime(v || .2, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    o.connect(g); g.connect(dest || this.sfx); o.start(t0); o.stop(t0 + d + .02);
  },
  noise(d, v, freq) {
    const c = this.ctx;
    if (!this.nbuf) { const n = c.sampleRate; this.nbuf = c.createBuffer(1, n, n); const a = this.nbuf.getChannelData(0); for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1; }
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t0 = c.currentTime;
    s.buffer = this.nbuf; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t0); s.stop(t0 + d + .02);
  },
  musicTick() {
    if (!this.ctx || Settings.mute || Settings.music <= 0) return;
    const notes = [55, 55, 65.41, 55, 73.42, 55, 65.41, 49], f = notes[this.step % 8];
    this.tone(f, .5, 'triangle', .5, null, 0, this.mus);
    if (this.step % 8 === 0) this.tone(f * 4, 1.4, 'sine', .12, null, 0, this.mus);
    if (this.step % 16 === 6) this.tone(f * 6, .8, 'sine', .08, null, 0, this.mus);
    this.step++;
  },
  play(name, arg) {
    if (!this.ctx || Settings.mute || Settings.sfx <= 0) return;
    const key = name + (arg == null ? '' : arg), now = performance.now();
    const gap = { shoot: 45, kill: 60, thud: 110, baseHit: 160 }[name] || 0;
    if (gap && now - (this.last[key] || 0) < gap) return;
    this.last[key] = now;
    const tr = arg || 0;
    switch (name) {
      case 'shoot': this.noise(.05 + tr * .02, .35, [2500, 3200, 2200, 1400][tr]); this.tone([520, 380, 260, 150][tr], .07, 'square', .1, 60); break;
      case 'reload': this.tone(900, .05, 'square', .12); this.tone(600, .07, 'square', .12, null, .2); break;
      case 'kill': this.tone(180, .18, 'sawtooth', .15, 50); break;
      case 'thud': this.noise(.12, .4, 350); break;
      case 'baseHit': this.tone(110, .2, 'square', .22, 60); break;
      case 'buy': this.tone(660, .07, 'square', .12); this.tone(990, .1, 'square', .12, null, .07); break;
      case 'click': this.tone(800, .04, 'square', .08); break;
      case 'wave': this.tone(196, .8, 'sawtooth', .22, 330); break;
      case 'boss': this.tone(70, 1.3, 'sawtooth', .35, 40); this.noise(.9, .3, 400); break;
      case 'lure': this.tone(500, .12, 'sine', .2, 900); this.tone(900, .15, 'sine', .15, 500, .12); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .25, 'triangle', .22, null, i * .15)); break;
      case 'lose': this.tone(300, 1.2, 'sawtooth', .28, 60); break;
    }
  }
};

/* ========================= 2) ASSETS =========================
   ใส่พาธรูป png แทน null เพื่อเปลี่ยนภาพ Unit (null = วาด placeholder เรขาคณิต) */
const SPRITES = {
  villager: null, police: null, zombie: null, infected: null, boss: null,
  barricade: null, base: null, bg: null
};
/* w,h=ขนาดวาด | anchor=จุดยึด 0..1 | facing=ทิศที่ภาพต้นฉบับหัน (1 ขวา,-1 ซ้าย)
   frameWidth/Height=ขนาด 1 เฟรมของ sprite sheet (null=ภาพนิ่ง) | anims={สถานะ:{row,frames,fps,loop}} */
const A = (row, frames, fps, loop = true) => ({ row, frames, fps, loop });
const unitAnims = () => ({ idle: A(0, 4, 6), walk: A(1, 6, 10), attack: A(2, 4, 10), die: A(3, 5, 10, false) });
const SPRITE_CONFIG = {
  villager: { w: 34,  h: 58,  anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: unitAnims() },
  police:   { w: 34,  h: 58,  anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: unitAnims() },
  zombie:   { w: 34,  h: 58,  anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: unitAnims() },
  infected: { w: 46,  h: 76,  anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: unitAnims() },
  boss:     { w: 120, h: 160, anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: unitAnims() },
  barricade:{ w: 110, h: 140, anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: {} },
  base:     { w: 170, h: 150, anchor: { x: .5, y: 1 }, facing: 1, frameWidth: null, frameHeight: null, anims: {} },
  bg:       {}
};

const Assets = {
  images: {},
  load() { for (const k in SPRITES) this.set(k, SPRITES[k]); },
  set(key, path) {
    const e = { img: null, ready: false };
    this.images[key] = e;
    if (!path) return;
    const img = new Image();
    img.onload = () => { e.ready = true; };
    img.onerror = () => console.warn('โหลดรูปไม่สำเร็จ:', key, path, '→ ใช้ placeholder แทน');
    img.src = path;
    e.img = img;
  },
  ready(key) { const e = this.images[key]; return !!(e && e.ready); },
  hasAnim(key, state) { const c = SPRITE_CONFIG[key]; return this.ready(key) && !!c.frameWidth && !!(c.anims && c.anims[state]); },
  animDuration(key, state, def) { return this.hasAnim(key, state) ? SPRITE_CONFIG[key].anims[state].frames / SPRITE_CONFIG[key].anims[state].fps : def; },
  drawBg(ctx) {
    if (!this.ready('bg')) return false;
    ctx.drawImage(this.images.bg.img, 0, 0, CONFIG.canvas.width, CONFIG.canvas.height);
    return true;
  },
  draw(ctx, key, state, t, x, y, o = {}) {
    if (!this.ready(key)) return false;
    const cfg = SPRITE_CONFIG[key], img = this.images[key].img, sheet = !!cfg.frameWidth;
    const fw = sheet ? cfg.frameWidth : img.naturalWidth, fh = sheet ? cfg.frameHeight : img.naturalHeight;
    let sx = 0, sy = 0;
    if (sheet) {
      const maxF = Math.max(0, Math.floor(img.naturalWidth / fw) - 1);
      if (o.frame != null) sx = Math.min(o.frame, maxF) * fw;
      else {
        const a = cfg.anims && (cfg.anims[state] || cfg.anims.idle);
        if (a) {
          let f = Math.floor(t * a.fps);
          f = a.loop === false ? Math.min(f, a.frames - 1) : f % a.frames;
          sx = Math.min(f, maxF) * fw; sy = a.row * fh;
        }
      }
    }
    const w = o.w || cfg.w, h = o.h || cfg.h;
    ctx.save();
    ctx.translate(x, y);
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.rot) ctx.rotate(-(o.dir || 1) * o.rot);
    if (o.dir && o.dir !== (cfg.facing || 1)) ctx.scale(-1, 1);
    ctx.drawImage(img, sx, sy, fw, fh, -w * cfg.anchor.x, -h * cfg.anchor.y, w, h);
    ctx.restore();
    return true;
  }
};

let S;                 // สถานะเกม (ด่านปัจจุบัน)
let screen = 'menu';   // 'menu' | 'stages' | 'game'

function newGame(stage) {
  const E = CONFIG.economy;
  stage = stage || (S && S.stage) || 1;
  S = {
    stage, sp: stageParams(stage),
    time: 0, money: E.startMoney + CONFIG.stages.startMoneyPerStage * (stage - 1), villagers: permVal('villStart'), villBought: 0,
    police: [],                                   // {x,y,gun:index ใน S.guns หรือ -1,...}
    guns: [],                                     // ปืนที่ซื้อมา (1 กระบอกต่อ 1 รายการ) {tier,ammo,reload,owner}
    boughtTier: CONFIG.guns.map(() => 0),
    upg: { pierce: false, explode: false },
    barLevel: 1, barHp: CONFIG.barricade.hpPerLevel[0], baseHp: CONFIG.base.maxHp,
    zombies: [], vills: [], tracers: [], rings: [], floats: [],
    specials: mkSpecials(), lures: [], grenades: [], fallen: [],
    gcfg: buildGunCfg(), villMax: permVal('villMax'), policeMax: permVal('polMax'), incomePer: permVal('villIncome'), polStartN: permVal('polStart'),
    shake: 0, barHit: 0, baseHit: 0, kills: 0,
    phase: 'rest', timer: CONFIG.wave.firstPrep, nextWave: 1, wave: 0,
    spawnQ: [], waveTime: 0, banner: null,
    maxWaves: waveCount(stage), lost: 0, rewarded: false, spits: [],
    incomeAcc: 0, incomeTimer: 0, paused: false, speed: 1, over: false, cleared: false
  };
  for (let i = 0; i < S.polStartN; i++) {          // ตำรวจเริ่มต้น (อัปเกรดถาวร) พร้อมปืนพกฟรี
    const pi = makePolice(); S.guns.push({ tier: 0, ammo: S.gcfg[0].mag, reload: 0, owner: -1 }); equip(pi, S.guns.length - 1);
  }
  if (typeof UI !== 'undefined') UI.onNewGame();
}

const barMaxHp = () => CONFIG.barricade.hpPerLevel.slice(0, S.barLevel).reduce((a, b) => a + b, 0);
const villagerCost = () => Math.ceil(CONFIG.economy.villager.baseCost * Math.pow(CONFIG.economy.villager.growth, S.villBought));
const livePolice = () => S.police.filter(p => !p.dead);
const policeCost = () => Math.ceil(CONFIG.economy.police.baseCost * Math.pow(CONFIG.economy.police.growth, Math.max(0, livePolice().length - S.polStartN)));
const gunPrice = i => Math.ceil(CONFIG.guns[i].price * Math.pow(CONFIG.economy.gunPriceGrowth, S.boughtTier[i]));
const barUpgradeCost = () => S.barLevel >= CONFIG.barricade.hpPerLevel.length ? null : CONFIG.barricade.upgradeCost[S.barLevel - 1];
const repairCost = () => Math.ceil((barMaxHp() - S.barHp) * CONFIG.barricade.repairCostPerHp);
const baseRepairCost = () => Math.ceil((CONFIG.base.maxHp - S.baseHp) * CONFIG.base.repairCostPerHp);
const tierOf = w => { const ts = CONFIG.wave.tiers; const i = ts.findIndex(x => w <= x.to); return { i: i < 0 ? ts.length - 1 : i, ...ts[i < 0 ? ts.length - 1 : i] }; };
const policeGun = p => p.gun >= 0 ? S.guns[p.gun] : null;

/* ---- ตัวละครพิเศษ ---- */
function mkSpecials() { return (Save.team || []).map((cls, i) => mkSpecial(cls, i)); }
function mkSpecial(cls, i) {
  const K = CONFIG.specials[cls], A = K.atk, hp0 = Math.round(K.hp * (1 + permVal('spHp')));
  return { cls, special: true, x: K.homeX - Math.floor(i / 3) * 18, y: [436, 462, 412][i % 3], hx: K.homeX - Math.floor(i / 3) * 18, hy: [436, 462, 412][i % 3],
    hp: hp0, maxHp: hp0, dmgMul: 1 + permVal('spAtk'), dead: false, dieT: 0, hurt: 0, cd: .3, t: Math.random() * 5, recoil: 0, attackT: 0, ammo: A.mag || 0, reload: 0,
    abCd: 3, charges: K.ability ? K.ability.charges : 0, rep: 0, work: null, dir: 1, moving: false, gun: -1 };
}
const allUnits = () => S.police.concat(S.specials);
const liveUnits = () => allUnits().filter(u => !u.dead);

function policePos(i) {
  const W = CONFIG.world;
  return { x: W.policeRight - (Math.floor(i / 3) % 5) * 26 - Math.floor(i / 15) * 9, y: W.groundTop + 26 + (i % 3) * 26 };
}
function newVill() {
  return { x: rand(25, 150), y: rand(CONFIG.world.groundTop + 14, CONFIG.world.groundBottom), tx: rand(25, 150), ty: rand(CONFIG.world.groundTop + 14, CONFIG.world.groundBottom), wait: rand(0, 2), t: Math.random() * 5, dir: 1, moving: false };
}

// ใส่ปืนให้ตำรวจ (1 กระบอกต่อ 1 นาย) gi = -1 คือถอดปืน
function equip(pi, gi) {
  const p = S.police[pi];
  if (p.gun >= 0) S.guns[p.gun].owner = -1;
  p.gun = gi;
  if (gi >= 0) S.guns[gi].owner = pi;
}
function autoEquip() {
  S.police.forEach((p, i) => { p.gun = -1; });
  S.guns.forEach(g => g.owner = -1);
  const order = S.guns.map((g, i) => i).sort((a, b) => S.guns[b].tier - S.guns[a].tier);
  const live = S.police.map((p, i) => i).filter(i => !S.police[i].dead);
  order.forEach((gi, k) => { if (k < live.length) equip(live[k], gi); });
}

/* ---- การกระทำของผู้เล่น ---- */
function buyVillager() {
  const c = villagerCost();
  if (S.over || S.money < c || S.villagers >= S.villMax) return;
  S.money -= c; S.villagers++; S.villBought++; Sound.play('buy');
}
function makePolice() {
  S.police.push({ ...policePos(S.police.length), gun: -1, hp: CONFIG.economy.police.hp, maxHp: CONFIG.economy.police.hp, dead: false, dieT: 0, hurt: 0, cd: Math.random() * .5, t: Math.random() * 5, recoil: 0, attackT: 0, dir: 1 });
  return S.police.length - 1;
}
function buyPolice() {
  const P = CONFIG.economy.police, c = policeCost();
  if (S.over || S.money < c || S.villagers - P.villagersRequired < P.minVillagersLeft || livePolice().length >= S.policeMax) return;
  S.money -= c; S.villagers -= P.villagersRequired;
  makePolice();
  // ใส่ปืนว่างที่แรงสุดให้อัตโนมัติ
  let best = -1;
  S.guns.forEach((g, i) => { if (g.owner === -1 && (best < 0 || g.tier > S.guns[best].tier)) best = i; });
  if (best >= 0) equip(S.police.length - 1, best);
  Sound.play('buy'); UI.refreshShop();
}
function upgradeBarricade() {
  const c = barUpgradeCost(); if (S.over || c == null || S.money < c) return;
  S.money -= c; S.barHp += CONFIG.barricade.hpPerLevel[S.barLevel]; S.barLevel++; Sound.play('buy');
}
function repairBarricade() {
  const c = repairCost(); if (S.over || c <= 0 || S.money < c) return;
  S.money -= c; S.barHp = barMaxHp(); Sound.play('buy');
}
function repairBase() {
  const c = baseRepairCost(); if (S.over || c <= 0 || S.money < c) return;
  S.money -= c; S.baseHp = CONFIG.base.maxHp; Sound.play('buy');
}

/* ========================= 4) UPDATE ========================= */

  S.banner = { text: t('ban.wave', { s: S.stage, w: S.wave, m: S.maxWaves }), sub: t('ban.tier', { t: t('tier' + tier.i) }) + (boss ? '  ' + t('ban.boss') : ''), t: 2.8, max: 2.8 };

  const T = [['runner', .12 + .02 * s], ['infected', w >= W_INF() ? chance : 0], ['armored', s >= 6 ? .1 + .01 * s : 0], ['exploder', s >= 7 ? .08 : 0], ['spitter', s >= 8 ? .1 : 0], ['screamer', s >= 9 ? .05 : 0]];

/* ---- ตำรวจ: ยิง/กระสุน/เปลี่ยนแม็ก ---- */
function updatePolice(dt) {

    p.hurt = Math.max(0, p.hurt - dt);
    p.t += dt; p.cd = Math.max(0, p.cd - dt); p.recoil = Math.max(0, p.recoil - dt * 8); p.attackT = Math.max(0, p.attackT - dt);
    const gi = policeGun(p); if (!gi) continue;

    }
    if (p.cd > 0) continue;
    let tgt = null;
    for (const z of S.zombies) {
      if (z.state === 'die' || z.x > CONFIG.canvas.width || Math.abs(z.x - p.x) > g.range) continue;   // ยิงได้ทั้งข้างหน้าและข้างหลัง (ซอมบี้ที่หลุดเข้าฐาน)   // จำกัดระยะยิงตามระดับปืน
      if (!tgt || z.x < tgt.x) tgt = z;
    }

    const K = CONFIG.specials[u.cls], A = K.atk;
    u.t += dt; u.hurt = Math.max(0, u.hurt - dt); u.cd = Math.max(0, u.cd - dt); u.abCd = Math.max(0, u.abCd - dt); u.rep = Math.max(0, u.rep - dt);
    u.recoil = Math.max(0, u.recoil - dt * 8); u.attackT = Math.max(0, u.attackT - dt); u.moving = false; u.work = null;
    if (u.reload > 0) { u.reload -= dt; if (u.reload <= 0) { u.reload = 0; u.ammo = A.mag; } }
    const alive = S.zombies.filter(z => z.state !== 'die' && z.x < CWd);
    if (K.type === 'melee') {
      const maxX = S.barHp > 0 ? W.barFront - 12 : 560;
      let tgt = null, best = 1e9;
      for (const z of alive) {
        if (z.x > maxX + A.range + 30) continue;
        const d = Math.abs(z.x - u.x) + Math.abs(z.y - u.y) * .5; if (d < best) { best = d; tgt = z; }
      }
      if (tgt) {
        if (Math.abs(tgt.x - u.x) <= A.range && Math.abs(tgt.y - u.y) < 40) {
          u.dir = tgt.x < u.x ? -1 : 1;
          if (u.cd <= 0) { u.cd = A.interval; u.attackT = .2; hitZombie(tgt, A.dmg * u.dmgMul); burst(tgt.x, tgt.y - tgt.h * .5, '#ffd9a0', 4, .7); Sound.play('thud'); }
        } else moveUnit(u, clamp(tgt.x - A.range * .6, W.baseFront + 10, maxX), tgt.y, dt);
      } else moveUnit(u, u.hx, u.hy, dt);
    } else if (K.type === 'support') {
      const R = K.repair, threat = alive.find(z => Math.abs(z.x - u.x) < R.threat && Math.abs(z.y - u.y) < 60);
      const job = threat ? null : medicJob(u, R);
      if (job) {
        if (Math.abs(u.x - job.x) > R.range) moveUnit(u, job.x + (u.x > job.x ? R.range * .6 : -R.range * .6), u.hy, dt);
        else {
          u.work = job.kind === 'heal' ? 'heal' : 'repair';
          if (u.rep <= 0) {
            u.rep = R.interval; u.attackT = .25;
            if (job.kind === 'heal') {
              const a = Math.min(R.heal, job.tgt.maxHp - job.tgt.hp);
              if (a > 0 && !job.tgt.dead) { job.tgt.hp += a; addFloat(job.tgt.x, job.tgt.y - 64, '+' + Math.round(a), '#4fd16f'); burst(job.tgt.x, job.tgt.y - 30, '#4fd16f', 4, .5); }
            } else {
              const bar = job.kind === 'bar', cur = bar ? S.barHp : S.baseHp, max = bar ? barMaxHp() : CONFIG.base.maxHp;
              const a = Math.min(R.hp, max - cur), cost = a * R.costPerHp;                  // ไม่ซ่อมเกินเลือดสูงสุด
              if (a > 0 && S.money >= cost) {
                S.money -= cost; if (bar) S.barHp += a; else S.baseHp += a;
                addFloat(bar ? W.barFront - 20 : W.baseFront - 20, W.groundTop - 40, '+' + Math.round(a) + ' 🔧', '#7fe0b0'); burst(bar ? W.barFront - 14 : W.baseFront - 10, W.groundTop + 20, '#7fe0b0', 3, .5);
              }
            }
          }
        }
      } else {
        const tgt = u.reload <= 0 && u.cd <= 0 ? pickTarget(u, K, alive) : null;
        if (tgt) specialShoot(u, K, tgt); else moveUnit(u, u.hx, u.hy, dt);
      }
    } else {                                      // ranged / sniper / lure
      if (K.type === 'lure') lureAbility(u, K, alive);
      if (u.reload <= 0 && u.cd <= 0) { const tgt = pickTarget(u, K, alive); if (tgt) specialShoot(u, K, tgt); }
      moveUnit(u, u.hx, u.hy, dt);
    }
  }
}

/* ---- ชาวบ้าน ---- */
function updateVillagers(dt) {
  const want = Math.min(S.villagers, S.villMax), W = CONFIG.world;
  while (S.vills.length < want) S.vills.push(newVill());
  while (S.vills.length > want) S.vills.pop();
  for (const v of S.vills) {
    v.t += dt;
    if (v.wait > 0) { v.wait -= dt; v.moving = false; continue; }
    const dx = v.tx - v.x, dy = v.ty - v.y, d = Math.hypot(dx, dy);
    if (d < 3) { v.wait = rand(1, 3.5); v.tx = rand(25, 150); v.ty = rand(W.groundTop + 14, W.groundBottom); v.moving = false; }
    else { v.x += dx / d * 28 * dt; v.y += dy / d * 28 * dt; v.dir = dx >= 0 ? 1 : -1; v.moving = true; }
  }
}

/* ---- เอฟเฟกต์ ---- */
function addFloat(x, y, text, color) { S.floats.push({ x, y, text, color, life: 1.1 }); }
function updateEffects(dt) {
  for (const tr of S.tracers) tr.life -= dt;
  S.tracers = S.tracers.filter(tr => tr.life > 0);
  for (const r of S.rings) { r.life -= dt; r.r = r.max * (1 - r.life / r.max2); }
  S.rings = S.rings.filter(r => r.life > 0);
  for (const f of S.floats) { f.life -= dt; f.y -= 28 * dt; }
  S.floats = S.floats.filter(f => f.life > 0);
  for (const q of S.spits) {
    q.t += dt; const f = Math.min(1, q.t / q.dur); q.x = q.x0 + (q.tx - q.x0) * f; q.y = q.y0 + (q.ty - q.y0) * f - Math.sin(f * 3.14) * 40;
    if (f >= 1 && !q.done) { q.done = true; if (q.pol && !q.pol.dead) hurtPolice(q.pol, q.dmg); else if (S.barHp > 0) { S.barHp = Math.max(0, S.barHp - q.dmg); S.barHit = .12; } else { S.baseHp -= q.dmg; S.baseHit = .12; } burst(q.tx, q.ty, '#55e08a', 5); }
  }
  S.spits = S.spits.filter(q => !q.done);
  for (const g of S.grenades) {
    g.t += dt; const f = Math.min(1, g.t / g.dur); g.x = g.x0 + (g.tx - g.x0) * f; g.y = g.y0 + (g.ty - g.y0) * f - Math.sin(f * 3.14) * 70;
    if (f >= 1 && !g.done) { g.done = true; S.lures.push({ x: g.tx, y: g.ty, r: g.B.radius, t: g.B.dur, max: g.B.dur }); burst(g.tx, g.ty - 6, '#7fffd4', 14); S.rings.push({ x: g.tx, y: g.ty, r: 0, max: g.B.radius, life: .5, max2: .5 }); Sound.play('lure'); }
  }
  S.grenades = S.grenades.filter(g => !g.done);
  for (const l of S.lures) l.t -= dt;
  S.lures = S.lures.filter(l => l.t > 0);
  if (S.parts) { for (const p of S.parts) { p.life -= dt; p.vy += 320 * dt; p.x += p.vx * dt; p.y += p.vy * dt; } S.parts = S.parts.filter(p => p.life > 0); }
  S.shake = Math.max(0, S.shake - dt * 1.5);
  S.barHit = Math.max(0, S.barHit - dt); S.baseHit = Math.max(0, S.baseHit - dt);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
}

  const g = sm.getContext('2d'), W = CONFIG.world, hor = Math.round((W.groundTop - 16) / P);
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const bands = ['#0f1426', '#151c36', '#1c2547', '#2a2c58', '#40335f', '#5d3b61', '#84485a', '#a85c55'], bh = hor / bands.length;

  for (let i = 0; i < 45; i++) { g.fillStyle = rnd() > .5 ? '#cfd6ff' : '#7a86c8'; g.fillRect(rnd() * w | 0, rnd() * hor * .5 | 0, 1, 1); }
  g.fillStyle = '#f2e7bd'; g.fillRect(228, 14, 10, 10); g.fillStyle = '#d6c88f'; g.fillRect(232, 17, 3, 3);
  bgWins = [];

      g.fillStyle = layer ? '#222a42' : '#161b30'; g.fillRect(x, hor - bt, bw, bt);
      g.fillStyle = layer ? '#2c3552' : '#1c223a'; g.fillRect(x, hor - bt, bw, 1);
      for (let wy = hor - bt + 4; wy < hor - 5; wy += 5)
        for (let wx = x + 2; wx < x + bw - 3; wx += 4) {
          const lit = rnd() > .72; g.fillStyle = lit ? '#ffb347' : (layer ? '#171c30' : '#12162a'); g.fillRect(wx, wy, 2, 3);
          if (lit && layer) bgWins.push([wx * P, wy * P, rnd() * 6.28]);
        }
      x += bw + (rnd() * 3 | 0);
    }
  }
  g.fillStyle = '#3a3c52'; g.fillRect(0, hor, w, h - hor);
  g.fillStyle = '#4a4d66'; g.fillRect(0, hor, w, 2);
  g.fillStyle = '#2d2f42'; g.fillRect(0, Math.round((W.groundBottom + 12) / P), w, h);

function humanoid(x, y, w, h, o) {
  const tt = o.t || 0, mv = o.moving ? 1 : 0, dir = o.dir || 1, F = v => o.flash ? '#fff' : v;
  const swing = Math.sin(tt * (mv ? 9 : 2)) * (mv ? .5 : .05);

  const legH = h * .32, bodyH = h * .36, headR = h * .15, shY = -legH - bodyH + h * .05, headY = -legH - bodyH - headR * .8;
  c.save(); c.translate(Math.round(x), Math.round(y - bob)); c.globalAlpha = o.alpha == null ? 1 : o.alpha;
  if (o.rot) c.rotate(-dir * o.rot);
  c.scale(dir, 1);
  c.fillStyle = F(o.pants);
  c.fillRect(-w * .3 + swing * w * .3, -legH, w * .24, legH);
  c.fillRect(w * .06 - swing * w * .3, -legH, w * .24, legH);
  c.fillStyle = F(o.shirt); c.fillRect(-w * .32, -legH - bodyH, w * .64, bodyH);
  if (o.armsOut) {

    for (const off of [-2, 4]) {
